<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kefania confirmation</title>
<style>
:root{color-scheme:dark;--bg:#15131c;--panel:#211d2b;--line:#393043;--text:#f2edf8;--muted:#b7aabe;--accent:#d6b5ff;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top right,#38234280,transparent 55%);min-height:100vh}main{max-width:1120px;margin:auto;padding:32px 28px 40px}header{display:flex;align-items:center;gap:16px;margin-bottom:28px}.mark{display:grid;place-items:center;font-size:32px;width:64px;height:64px;border:1px solid #59436b;border-radius:20px;background:linear-gradient(135deg,#453050,#272033);box-shadow:0 10px 32px #0003}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:700;color:var(--accent);margin:0 0 4px}h1{font-size:26px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.6px}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}.card{background:linear-gradient(150deg,#292132,var(--panel));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 16px 45px #0002}.card-head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}h2{font-size:20px;line-height:1.4;margin:6px 0 10px;overflow-wrap:anywhere}h3{font-size:16px;margin:22px 0 10px}.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:#a98aa9}.status.ready:before{background:#b9deb4;box-shadow:0 0 10px #b9deb433}.content{padding:8px 24px 24px;overflow-wrap:anywhere}.content:empty{display:none}.content p{margin:15px 0}.content ul{padding-left:20px}.content li{margin:8px 0}.content pre{background:#16121c;padding:14px;border-radius:9px;white-space:pre-wrap;font:12px/1.7 ui-monospace,monospace}.content code{font-size:.9em;background:#ffffff09;padding:2px 4px;border-radius:4px}a{color:var(--accent);text-decoration-color:#89709f;text-underline-offset:3px}a:hover{color:#ead7ff}.actions{padding:18px 24px;background:#19151f;border-top:1px solid var(--line)}button{font:600 14px system-ui;padding:12px 18px;border:1px solid #d6b5ff88;border-radius:10px;background:linear-gradient(135deg,#d6b5ff,#cda3e5);color:#291830;cursor:pointer;box-shadow:0 5px 18px #0002}button:hover{filter:brightness(1.08)}button:disabled{background:#352c40;color:#aa97b8;border-color:#4b3d58;cursor:default;box-shadow:none}.publication{font-size:13px;margin:10px 0 0}.publication:empty{display:none}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:20px 24px 0}.images:empty{display:none}figure{margin:0;border:1px solid #44364e;border-radius:12px;overflow:hidden;background:#17131e}.image-stage{display:grid;place-items:center;min-height:150px;background:radial-gradient(ellipse,#382e42,#1b1722)}img{display:block;width:100%;height:220px;object-fit:contain}figcaption{padding:9px 12px;font-size:11px;color:var(--muted)}.image-error{padding:22px;color:var(--muted);text-align:center;font-size:13px}[hidden]{display:none!important}button:focus-visible,a:focus-visible{outline:2px solid #f5d4ff;outline-offset:4px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:24px 20px}.card-head,.content,.actions{padding-left:22px;padding-right:22px}}@media(prefers-reduced-motion:no-preference){.card{animation:arrive .35s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
.actions:has(> #publish[hidden]):has(> #publication:empty):has(> #close-error:empty){display:none}
#draft-status:has(a){display:block}#draft-status:has(a)::before{display:none}
.status.pack-tag{padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--accent);background:#ffffff06}.status.pack-tag::before{display:none}
.merge-controls{margin:10px 0 12px}.merge-controls button{padding:10px 15px}.merge-controls .publication{color:#f0bdc5}.close-confirmation{position:fixed;top:16px;left:16px;right:auto;z-index:10;display:grid;place-items:center;width:36px;height:36px;margin:0;padding:0;font-size:22px;line-height:1;border-radius:6px;letter-spacing:0;box-shadow:none;color:#fff}.close-confirmation.on-right{left:auto;right:16px}.pony-column{display:flex;flex-direction:column;min-width:0}
/* A PR without pony research should occupy the complete content grid. */
.layout:has(#pony-section[hidden]){grid-template-columns:minmax(0,1fr)}
.layout:has(#pony-section[hidden]) .pony-column{display:none}.close-button-left header{padding-left:44px}.close-button-right header{padding-right:44px}.close-button-middle header{position:relative;padding-right:52px}.close-button-middle .close-confirmation{position:absolute;top:50%;left:auto;right:0;transform:translateY(-50%);margin:0}

/* Native modal image viewer keeps pony previews in this confirmation window. */
.image-trigger{display:block;width:100%;padding:0;border:0;border-radius:0;background:transparent;color:inherit;box-shadow:none;text-align:left;cursor:zoom-in}
.image-trigger:hover{filter:none;background:#33283d}
.image-trigger:focus-visible{outline:2px solid #f5d4ff;outline-offset:-3px}
.image-trigger img{pointer-events:none}
.lightbox{position:fixed;inset:0;margin:auto;width:96vw;height:95vh;max-width:96vw;max-height:95vh;padding:0;border:1px solid #6b5278;border-radius:12px;background:#1c1725;color:var(--text);box-shadow:0 25px 80px #000a}
.lightbox[open]{display:grid;grid-template-rows:minmax(0,1fr) auto}
.lightbox::backdrop{background:#08060edb}
.lightbox-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;overflow:hidden;padding:8px 42px}
.lightbox-stage img{flex:1;min-width:0;width:0;height:100%;min-height:0;max-height:100%;object-fit:contain;margin:auto}
.lightbox-stage .image-error{flex:1}
.lightbox-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;min-height:48px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;overflow:hidden}
.lightbox-footer span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.lightbox-footer a{flex:none;white-space:nowrap}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:1;display:grid;place-items:center;flex:none;width:clamp(44px,5vw,72px);height:min(75%,560px);min-height:0;padding:0;border:1px solid #6b527877;border-radius:9px;background:#35263f77;color:#fff;box-shadow:none;font-size:36px}
.lightbox-nav:hover{filter:none;background:#50385ddd}
#lightbox-prev{left:0}#lightbox-next{right:0}
.lightbox-close{position:absolute;top:8px;right:8px;z-index:2;display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid #6b5278;border-radius:8px;background:#35263f;color:#fff;box-shadow:none;font-size:25px;line-height:1}
.lightbox-close:hover{filter:none;background:#50385d}
.lightbox button:focus-visible{outline:2px solid #f5d4ff;outline-offset:2px}
@media(max-width:600px){.lightbox{width:96vw;height:94vh;max-height:94vh}.lightbox-stage{padding:6px 36px}.lightbox-nav{width:38px;height:75%;font-size:28px}.lightbox-footer{padding:8px;font-size:11px;gap:8px}}

/* Theme mode uses the same resolved colors as the surrounding workbench. */
:root[data-theme-colors]{color-scheme:light dark;--bg:var(--kefania-bg);--panel:var(--kefania-panel,var(--bg));--line:var(--kefania-line,var(--muted));--text:var(--kefania-text);--muted:var(--kefania-muted,var(--text));--accent:var(--kefania-accent,var(--text))}
[data-theme-colors] body{background:var(--bg)}
[data-theme-colors] .card,[data-theme-colors] .mark,[data-theme-colors] .image-stage,[data-theme-colors] figure,[data-theme-colors] .actions,[data-theme-colors] .lightbox{background:var(--panel);border-color:var(--line)}
[data-theme-colors] .content pre{background:var(--kefania-code,var(--bg))}
[data-theme-colors] a{color:var(--accent);text-decoration-color:currentColor}
[data-theme-colors] button{background:var(--kefania-button,var(--accent));color:var(--kefania-buttonText,var(--bg));border-color:var(--line)}
[data-theme-colors] button:hover{filter:none;background:var(--kefania-buttonHover,var(--kefania-button,var(--accent)))}
[data-theme-colors] .close-confirmation,[data-theme-colors] .lightbox-close,[data-theme-colors] .lightbox-nav{background:var(--kefania-control,var(--panel));color:var(--kefania-controlText,var(--text));border-color:var(--line)}
[data-theme-colors] .close-confirmation:hover,[data-theme-colors] .lightbox-close:hover,[data-theme-colors] .lightbox-nav:hover{background:var(--kefania-controlHover,var(--bg))}
[data-theme-colors] button:disabled{background:var(--panel);color:var(--muted);opacity:.6}
[data-theme-colors] .image-trigger{background:transparent;color:inherit;border:0}
[data-theme-colors] .image-trigger:hover{background:var(--kefania-controlHover,var(--panel))}
[data-theme-colors] button:focus-visible,[data-theme-colors] a:focus-visible{outline-color:var(--kefania-focus,var(--accent))}
[data-theme-colors] .merge-controls .publication{color:var(--kefania-error,var(--text))}
[data-theme-colors] .status:before,[data-theme-colors] .status.ready:before{background:var(--accent);box-shadow:none}
</style>
<main><header><div class="mark" aria-hidden="true">🦄</div><div><p class="eyebrow">Kefania</p><h1>Ready when you are</h1><p class="subtitle">Review the pull request draft.</p></div><button id="close-confirmation" class="close-confirmation" type="button" aria-label="Close window" title="Close window">×</button></header>
<div class="layout">
<div class="pony-column"><section id="pony-section" class="card" hidden><div class="card-head"><p class="eyebrow">Meet the pony</p><h2 id="pony-title">Pony profile</h2><p id="pony-status" class="status" role="status">Researching the pony…</p></div><div id="images" class="images"></div><div id="profile" class="content"></div></section></div>
<section class="card"><div class="card-head"><p class="eyebrow">Pull request</p><h2 id="title">Preparing your draft</h2><div id="merge-controls" class="merge-controls" hidden><button id="merge" type="button">Squash and merge</button><p id="merge-error" class="publication" role="alert"></p></div><p id="draft-status" class="status" role="status">Drafting the pull request…</p></div><div id="body" class="content"></div><div class="actions"><button id="publish" disabled>Publish pull request ↗</button><p id="publication" class="publication" role="status"></p><p id="close-error" class="publication" role="alert"></p></div></section>
</div>
<dialog id="image-lightbox" class="lightbox" aria-label="Pony image viewer">
<div class="lightbox-stage"><button id="lightbox-prev" class="lightbox-nav" type="button" aria-label="Previous image">‹</button><img id="lightbox-image" alt="" referrerpolicy="no-referrer" decoding="async"><p id="lightbox-error" class="image-error" hidden>Image could not be loaded. Use “View source” to open the source.</p><button id="lightbox-next" class="lightbox-nav" type="button" aria-label="Next image">›</button><button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close image viewer">×</button></div>
<div class="lightbox-footer"><span id="lightbox-caption"></span><a id="lightbox-source" target="_blank" rel="noopener noreferrer">View source ↗</a></div>
</dialog></main>
<script>
__MARKDOWN_RENDERER__
const intake = /\/(draft|pony)$/.exec(location.pathname);
const root = location.pathname.replace(/\/(draft|pony)$/, '');
const confirmationToken = root.split('/').pop().slice(0,8);
document.title = 'Kefania confirmation · ' + confirmationToken;
const fragment = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, '', location.pathname);
const el = id => document.getElementById(id);
let lastProfile, lastBody;
let imageSources=[],currentImage=-1,focusBeforeLightbox,imageGeneration=0;
const lightbox=el('image-lightbox');
function safeLink(url){try{const value=new URL(url);return ['https:','http:'].includes(value.protocol)&&!value.username&&!value.password?value.href:null}catch{return null}}
function imageSourcePage(url){
  const value=new URL(url);
  const host={'derpicdn.net':'derpibooru.org','static.manebooru.art':'manebooru.art'}[value.hostname];
  const id=/^\/img\/(?:view\/|download\/)?\d{4}\/\d{1,2}\/\d{1,2}\/(\d+)(?:[_/.]|$)/.exec(value.pathname)?.[1];
  return host&&id?'https://'+host+'/images/'+id:url;
}
function renderMarkdown(target, markdown) {
  target.replaceChildren();
  renderMergeMarkdown(target, markdown, {
    baseUrl: 'https://github.com/',
    mapLink: imageSourcePage
  });
}

// Size the dialog once for the tallest currently loaded image at the gallery's
// available width. A shared height prevents jumps when cycling aspect ratios.
// The 48px footer and 16px image-stage padding are included in the budget.
function fitLightboxToGallery(){
  const narrow=window.innerWidth<=600;
  const maxDialogHeight=window.innerHeight*(narrow?0.94:0.95);
  const imageWidth=Math.max(1,window.innerWidth*0.96-(narrow?72:84));
  const stageMax=Math.max(1,maxDialogHeight-48-2);
  const needed=imageSources.reduce((height,source)=>{
    const width=Number(source.width),imageHeight=Number(source.height);
    if(!(width>0&&imageHeight>0))return height;
    return Math.max(height,imageWidth*imageHeight/width+16);
  },0);
  const stageHeight=Math.min(stageMax,Math.max(Math.min(220,stageMax),needed));
  lightbox.style.height=Math.round(stageHeight+48+2)+'px';
}
window.addEventListener('resize',()=>{if(lightbox.open)fitLightboxToGallery()});
function showImage(index){
  const image=imageSources[index];
  if(!image)return;
  currentImage=index;
  fitLightboxToGallery();
  const displayed=el('lightbox-image');
  displayed.hidden=false;
  el('lightbox-error').hidden=true;
  displayed.alt=image.label;
  displayed.src=image.url;
  el('lightbox-caption').textContent=image.label+' · '+(index+1)+' of '+imageSources.length;
  el('lightbox-caption').title=image.label;
  el('lightbox-source').href=image.source;
  el('lightbox-prev').hidden=imageSources.length<2;
  el('lightbox-next').hidden=imageSources.length<2;
  if(!lightbox.open){focusBeforeLightbox=document.activeElement;lightbox.showModal()}
}
function stepImage(delta){
  if(currentImage>=0&&imageSources.length>1)showImage((currentImage+delta+imageSources.length)%imageSources.length);
}
function imageIndex(profile){
  if(lightbox.open)lightbox.close();
  const generation=++imageGeneration;
  el('images').replaceChildren();
  imageSources=[];
  const seen=new Set(),candidates=[];
  const displayLoaded=()=>{
    if(generation!==imageGeneration)return;
    const selected=imageSources[currentImage];
    const loaded=candidates.filter(item=>item.loaded);
    imageSources=loaded.map(item=>item.source);
    el('images').replaceChildren(...loaded.map(item=>item.figure));
    if(lightbox.open)fitLightboxToGallery();
    if(lightbox.open&&selected){
      currentImage=imageSources.indexOf(selected);
      if(currentImage<0)lightbox.close();
      else{
        el('lightbox-caption').textContent=selected.label+' · '+(currentImage+1)+' of '+imageSources.length;
        el('lightbox-prev').hidden=imageSources.length<2;
        el('lightbox-next').hidden=imageSources.length<2;
      }
    }
  };
  return profile.replace(/\[!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)\]\((https:\/\/[^\s)]+)\)|!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g,(whole,linkedLabel,linkedUrl,page,label,url)=>{
    label=linkedLabel??label;
    url=linkedUrl||url;
    const safe=safeLink(url);
    if(!safe||seen.has(safe))return '';
    seen.add(safe);
    const captionText=label||'Character image';
    const sourceUrl=safeLink(page||'')||imageSourcePage(safe);
    const source={url:safe,source:sourceUrl,label:captionText};
    const figure=document.createElement('figure'),stage=document.createElement('div'),trigger=document.createElement('button'),img=document.createElement('img'),caption=document.createElement('figcaption');
    const candidate={source,figure,loaded:false};
    candidates.push(candidate);
    stage.className='image-stage';
    trigger.type='button';
    trigger.className='image-trigger';
    trigger.setAttribute('aria-label','Enlarge '+captionText);
    trigger.addEventListener('click',()=>showImage(imageSources.indexOf(source)));
    img.alt=captionText;
    img.referrerPolicy='no-referrer';
    img.decoding='async';
    caption.textContent=captionText;
    img.onload=()=>{
      if(generation!==imageGeneration||!img.naturalWidth||candidate.loaded)return;
      candidate.loaded=true;
      source.width=img.naturalWidth;
      source.height=img.naturalHeight;
      displayLoaded();
    };
    img.onerror=()=>{
      if(generation!==imageGeneration||!candidate.loaded)return;
      candidate.loaded=false;
      displayLoaded();
    };
    stage.append(img);
    trigger.append(stage);
    figure.append(trigger,caption);
    // An artwork card becomes visible only after the browser loads real image data.
    img.src=safe;
    return '';
  });
}
el('lightbox-image').addEventListener('error',()=>{
  el('lightbox-image').hidden=true;
  el('lightbox-error').hidden=false;
});
el('lightbox-close').addEventListener('click',()=>lightbox.close());
el('lightbox-prev').addEventListener('click',()=>stepImage(-1));
el('lightbox-next').addEventListener('click',()=>stepImage(1));
lightbox.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey)return;
  if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
    event.preventDefault();
    stepImage(event.key==='ArrowLeft'?-1:1);
  }
});
lightbox.addEventListener('click',event=>{
  if(event.target!==lightbox)return;
  const rect=lightbox.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)lightbox.close();
});
lightbox.addEventListener('close',()=>{
  currentImage=-1;
  const previous=focusBeforeLightbox;
  focusBeforeLightbox=undefined;
  previous?.focus();
});
function applyAppearance(colors){
  const root=document.documentElement;
  const keys=['bg','panel','line','text','muted','accent','button','buttonText','buttonHover','control','controlText','controlHover','focus','error','code'];
  const valid=colors&&typeof colors==='object'&&CSS.supports('color',colors.bg)&&CSS.supports('color',colors.text);
  root.toggleAttribute('data-theme-colors',Boolean(valid));
  for(const key of keys){
    const value=valid&&colors[key];
    if(typeof value==='string'&&CSS.supports('color',value))root.style.setProperty('--kefania-'+key,value);
    else root.style.removeProperty('--kefania-'+key);
  }
}
async function refresh(){try{const response=await fetch(root+'/state');const state=await response.json();if(!response.ok)throw new Error(state.error);
applyAppearance(state.appearance);
if(state.draft){el('title').textContent=state.draft.title;if(lastBody!==state.draft.body){lastBody=state.draft.body;renderMarkdown(el('body'),state.draft.body)}if(!state.result)el('draft-status').textContent='Draft ready for review.';el('draft-status').classList.add('ready')}else el('draft-status').textContent=state.errors.draft||'Drafting the pull request…';
el('publish').disabled=!state.draft||state.attempted||state.publishing;
el('publish').hidden=state.autoPublish||!!state.result;
const closeVisible=state.showKefaniaCloseButton!==false;
const closePosition=['left','middle','right'].includes(state.kefaniaCloseButtonPosition)?state.kefaniaCloseButtonPosition:'left';
el('close-confirmation').hidden=!closeVisible;
el('close-confirmation').classList.toggle('on-right',closePosition==='right');
for(const position of ['left','middle','right'])document.querySelector('main').classList.toggle('close-button-'+position,closeVisible&&closePosition===position);
el('merge-controls').hidden=!state.result||!!state.mergeResult;
el('merge').disabled=!state.result||!!state.mergeResult||!!state.merging;
el('merge').textContent=state.merging?'Merging…':'Squash and merge';
el('merge-error').textContent=state.errors.merge||'';
if(state.autoPublish&&!state.result)el('publication').textContent=state.errors.publish||(state.publishing?'Publishing your pull request…':'Auto-publish is on.');
if(state.result){document.title='PR #'+state.result.number+' · Kefania · '+confirmationToken;document.querySelector('h1').textContent='PR #'+state.result.number;}
if(state.result){el('publication').replaceChildren();el('draft-status').replaceChildren(document.createTextNode('🦄 PR #'+state.result.number+(state.mergeResult?' merged. ':' published. ')));const link=document.createElement('a');link.href=state.result.url;link.textContent='Open pull request ↗';el('draft-status').append(link)}
el('pony-section').hidden=!state.pony;
const subtitle=state.result?(state.mergeResult?'Pull request merged. Review the details':'Pull request published. Review the details'):'Review the pull request draft';
document.querySelector('.subtitle').textContent=subtitle+(state.pony?' and supporting character research':'')+'.';
if(state.pony)el('pony-title').textContent=state.pony.name||String(state.pony.slug).split('-').map(part=>part.charAt(0).toUpperCase()+part.slice(1)).join(' ');
const packLabel=state.pony?.packLabel||state.pony?.packId||'';
el('pony-status').textContent=state.profile?packLabel:state.errors.pony||'Researching the pony…';
el('pony-status').hidden=!!state.profile&&!packLabel;
el('pony-status').classList.toggle('pack-tag',!!state.profile&&!!packLabel);
if(state.profile&&state.profile!==lastProfile){lastProfile=state.profile;renderMarkdown(el('profile'),imageIndex(state.profile))}
}catch(error){el('draft-status').textContent=error.message}}
el('merge').onclick=async()=>{
  const state=await (await fetch(root+'/state')).json();
  if(!state.result||state.mergeResult||state.merging)return;
  if(state.ludicrousMode!==true&&!confirm('Squash and merge PR #'+state.result.number+' into '+(state.result.base||'its base branch')+'? This cannot be undone.'))return;
  el('merge').disabled=true;el('merge-error').textContent='';
  try{const response=await fetch(root+'/merge',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const result=await response.json();if(!response.ok)throw new Error(result.error||'Merge failed.');await refresh();
    if(result.merged===true&&state.closeAfterMerge===true)await el('close-confirmation').onclick();
  }catch(error){el('merge').disabled=false;el('merge-error').textContent=error.message||'Merge failed. Check GitHub.';}
};
el('close-confirmation').onclick=async()=>{el('close-confirmation').disabled=true;el('close-error').textContent='';try{const response=await fetch(root+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!response.ok){const result=await response.json();throw new Error(result.error||'Could not close the window.')}}catch(error){el('close-confirmation').disabled=false;el('close-error').textContent=error.message||'Could not close the window. Use its window controls instead.'}};
el('publish').onclick=async()=>{el('publish').disabled=true;el('publication').textContent='Publishing your pull request…';try{const response=await fetch(root,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const result=await response.json();if(!response.ok)throw new Error(result.error);await refresh()}catch(error){el('publication').textContent=error.message}};
(async()=>{if(intake){const values=intake[1]==='draft'?{title:fragment.get('title'),body:fragment.get('body')}:{profile:fragment.get('profile')};try{const response=await fetch(location.pathname,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const result=await response.json();if(!response.ok)throw new Error(result.error);location.replace(root)}catch(error){el('draft-status').textContent=error.message}return}await refresh();setInterval(refresh,1500)})();
</script></html>
