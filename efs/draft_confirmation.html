<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kefania confirmation</title>
<style>
:root{color-scheme:dark;--bg:#15131c;--panel:#211d2b;--line:#393043;--text:#f2edf8;--muted:#b7aabe;--accent:#d6b5ff;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top right,#38234280,transparent 55%);min-height:100vh}main{max-width:1120px;margin:auto;padding:32px 28px 40px}header{display:flex;align-items:center;gap:16px;margin-bottom:28px}.mark{display:grid;place-items:center;font-size:32px;width:64px;height:64px;border:1px solid #59436b;border-radius:20px;background:linear-gradient(135deg,#453050,#272033);box-shadow:0 10px 32px #0003}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:700;color:var(--accent);margin:0 0 4px}h1{font-size:26px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.6px}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}.card{background:linear-gradient(150deg,#292132,var(--panel));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 16px 45px #0002}.card-head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}h2{font-size:20px;line-height:1.4;margin:6px 0 10px;overflow-wrap:anywhere}h3{font-size:16px;margin:22px 0 10px}.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:#a98aa9}.status.ready:before{background:#b9deb4;box-shadow:0 0 10px #b9deb433}.content{padding:8px 24px 24px;overflow-wrap:anywhere}.content:empty{display:none}.content p{margin:15px 0}.content ul{padding-left:20px}.content li{margin:8px 0}.content pre{background:#16121c;padding:14px;border-radius:9px;white-space:pre-wrap;font:12px/1.7 ui-monospace,monospace}.content code{font-size:.9em;background:#ffffff09;padding:2px 4px;border-radius:4px}a{color:var(--accent);text-decoration-color:#89709f;text-underline-offset:3px}a:hover{color:#ead7ff}.actions{padding:18px 24px;background:#19151f;border-top:1px solid var(--line)}button{font:600 14px system-ui;padding:12px 18px;border:1px solid #d6b5ff88;border-radius:10px;background:linear-gradient(135deg,#d6b5ff,#cda3e5);color:#291830;cursor:pointer;box-shadow:0 5px 18px #0002}button:hover{filter:brightness(1.08)}button:disabled{background:#352c40;color:#aa97b8;border-color:#4b3d58;cursor:default;box-shadow:none}.publication{font-size:13px;margin:10px 0 0}.publication:empty{display:none}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:20px 24px 0}.images:empty{display:none}figure{margin:0;border:1px solid #44364e;border-radius:12px;overflow:hidden;background:#17131e}.image-stage{display:grid;place-items:center;min-height:150px;background:radial-gradient(ellipse,#382e42,#1b1722)}img{display:block;width:100%;height:220px;object-fit:contain}figcaption{padding:9px 12px;font-size:11px;color:var(--muted)}.image-error{padding:22px;color:var(--muted);text-align:center;font-size:13px}footer{margin-top:22px;font-size:11px;color:#918198;text-align:center}[hidden]{display:none!important}button:focus-visible,a:focus-visible{outline:2px solid #f5d4ff;outline-offset:4px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:24px 20px}.card-head,.content,.actions{padding-left:22px;padding-right:22px}}@media(prefers-reduced-motion:no-preference){.card{animation:arrive .35s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
<main><header><div class="mark" aria-hidden="true">🦄</div><div><p class="eyebrow">Kefania</p><h1>Ready when you are</h1><p class="subtitle">Your pull request and a little pony discovery.</p></div></header>
<div class="layout">
<section class="card"><div class="card-head"><p class="eyebrow">Pull request</p><h2 id="title">Preparing your draft</h2><p id="draft-status" class="status" role="status">Drafting the pull request…</p></div><div id="body" class="content"></div><div class="actions"><button id="publish" disabled>Publish pull request ↗</button><p id="publication" class="publication" role="status"></p></div></section>
<section id="pony-section" class="card"><div class="card-head"><p class="eyebrow">Meet the pony</p><h2 id="pony-title">Pony profile</h2><p id="pony-status" class="status" role="status">Researching the pony…</p></div><div id="images" class="images"></div><div id="profile" class="content"></div></section>
</div><footer>PR drafting and pony research finish independently.</footer></main>
<script>
const intake = /\/(draft|pony)$/.exec(location.pathname);
const root = location.pathname.replace(/\/(draft|pony)$/, '');
const fragment = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, '', location.pathname);
const el = id => document.getElementById(id);
let lastProfile, lastBody;
function safeLink(url){try{const value=new URL(url);return ['https:','http:'].includes(value.protocol)&&!value.username&&!value.password?value.href:null}catch{return null}}
function inline(parent,text){const pattern=/(\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|\*\*([^*]+)\*\*|`([^`]+)`|https?:\/\/[^\s<>]+)/g;let start=0;for(const match of text.matchAll(pattern)){parent.append(document.createTextNode(text.slice(start,match.index)));const url=match[3]||(/^https?:/.test(match[0])?match[0]:null);let node;if(url&&safeLink(url)){node=document.createElement('a');node.href=safeLink(url);node.target='_blank';node.rel='noopener noreferrer';node.textContent=match[2]||url}else if(match[4]||match[5]){node=document.createElement(match[4]?'strong':'code');node.textContent=match[4]||match[5]}else node=document.createTextNode(match[0]);parent.append(node);start=match.index+match[0].length}parent.append(document.createTextNode(text.slice(start)))}
function renderMarkdown(target,markdown){target.replaceChildren();let paragraph=[],list,code;const flush=()=>{if(paragraph.length){const p=document.createElement('p');inline(p,paragraph.join(' '));target.append(p);paragraph=[]}list=undefined};for(const line of markdown.split('\n')){if(/^\s*```/.test(line)){flush();if(code){target.append(code);code=undefined}else code=document.createElement('pre');continue}if(code){code.append(document.createTextNode(line+'\n'));continue}if(!line.trim()){flush();continue}const heading=/^#{1,6}\s+(.+)$/.exec(line),item=/^\s*(?:[-*]|\d+\.)\s+(.+)$/.exec(line);if(heading){flush();const h=document.createElement('h3');inline(h,heading[1]);target.append(h)}else if(item){if(paragraph.length)flush();if(!list){list=document.createElement('ul');target.append(list)}const li=document.createElement('li');inline(li,item[1]);list.append(li)}else{list=undefined;paragraph.push(line)}}flush();if(code)target.append(code)}
function imageIndex(profile){el('images').replaceChildren();const seen=new Set();return profile.replace(/!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g,(whole,label,url)=>{if(!safeLink(url)||seen.has(url))return '';seen.add(url);const figure=document.createElement('figure'),stage=document.createElement('div'),link=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption');stage.className='image-stage';link.href=url;link.target='_blank';link.rel='noopener noreferrer';img.src=url;img.alt=label||'Character image';img.referrerPolicy='no-referrer';img.decoding='async';img.onerror=()=>{const fallback=document.createElement('span');fallback.className='image-error';fallback.textContent='View image at its source ↗';stage.replaceChildren(fallback)};stage.append(img);link.append(stage);caption.textContent=label||'Image source ↗';link.append(caption);figure.append(link);el('images').append(figure);return ''})}
async function refresh(){try{const response=await fetch(root+'/state');const state=await response.json();if(!response.ok)throw new Error(state.error);
if(state.draft){el('title').textContent=state.draft.title;if(lastBody!==state.draft.body){lastBody=state.draft.body;renderMarkdown(el('body'),state.draft.body)}el('draft-status').textContent='Draft ready for review.';el('draft-status').classList.add('ready')}else el('draft-status').textContent=state.errors.draft||'Drafting the pull request…';
el('publish').disabled=!state.draft||state.attempted||state.publishing;
el('publish').hidden=state.autoPublish;
if(state.autoPublish&&!state.result)el('publication').textContent=state.errors.publish||(state.publishing?'Publishing your pull request…':'Auto-publish is on.');
if(state.result){document.title='PR #'+state.result.number+' · Kefania';document.querySelector('h1').textContent='PR #'+state.result.number;}
if(state.result){el('publication').replaceChildren(document.createTextNode('🦄 PR #'+state.result.number+' published. '));const link=document.createElement('a');link.href=state.result.url;link.textContent='Open pull request ↗';el('publication').append(link)}
el('pony-section').hidden=!state.pony;
if(state.pony)el('pony-title').textContent=state.pony.name||String(state.pony.slug).split('-').map(part=>part.charAt(0).toUpperCase()+part.slice(1)).join(' ');
el('pony-status').textContent=state.profile?'Profile ready':state.errors.pony||'Researching the pony…';el('pony-status').classList.toggle('ready',!!state.profile);
if(state.profile&&state.profile!==lastProfile){lastProfile=state.profile;renderMarkdown(el('profile'),imageIndex(state.profile))}
}catch(error){el('draft-status').textContent=error.message}}
el('publish').onclick=async()=>{el('publish').disabled=true;el('publication').textContent='Publishing your pull request…';try{const response=await fetch(root,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const result=await response.json();if(!response.ok)throw new Error(result.error);await refresh()}catch(error){el('publication').textContent=error.message}};
(async()=>{if(intake){const values=intake[1]==='draft'?{title:fragment.get('title'),body:fragment.get('body')}:{profile:fragment.get('profile')};try{const response=await fetch(location.pathname,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const result=await response.json();if(!response.ok)throw new Error(result.error);location.replace(root)}catch(error){el('draft-status').textContent=error.message}return}await refresh();setInterval(refresh,1500)})();
</script></html>
