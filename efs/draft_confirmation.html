<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kefania confirmation</title>
<style>
:root{color-scheme:dark;background:#1e1e1e;color:#e6e6e6}body{font:15px system-ui;max-width:900px;margin:24px auto;padding:20px}section{border-top:1px solid #444;padding:16px 0}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}button{font:inherit;padding:10px 16px;background:#303030;color:#fff;border:1px solid #555;border-radius:6px;cursor:pointer}button:disabled{opacity:.55;cursor:default}a{color:#9ac7ff}img{max-width:100%;max-height:260px;object-fit:contain}.muted{color:#aaa}.images{display:flex;flex-wrap:wrap;gap:12px}.images a{max-width:300px}h1{font-size:22px}h2{font-size:18px}
</style>
<h1>🦄 Kefania confirmation</h1>
<section><h2 id="title">Pull request</h2><p id="draft-status" class="muted">Drafting the pull request…</p><pre id="body"></pre><button id="publish" disabled>Publish pull request</button><p id="publication"></p></section>
<section id="pony-section"><h2 id="pony-title">Pony profile</h2><p id="pony-status" class="muted">Researching the pony independently…</p><pre id="profile"></pre><div id="images" class="images"></div></section>
<script>
const intake = /\/(draft|pony)$/.exec(location.pathname);
const root = location.pathname.replace(/\/(draft|pony)$/, '');
const fragment = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, '', location.pathname);
const el = id => document.getElementById(id);
let latest, lastProfile;
function imageIndex(profile){el('images').replaceChildren();for(const match of profile.matchAll(/!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g)){const link=document.createElement('a');link.href=match[2];link.target='_blank';link.rel='noopener noreferrer';const img=document.createElement('img');img.src=match[2];img.alt=match[1]||'Character image';link.append(img);el('images').append(link)}}
async function refresh(){try{const response=await fetch(root+'/state');const state=await response.json();if(!response.ok)throw new Error(state.error);latest=state;
if(state.draft){el('title').textContent=state.draft.title;el('body').textContent=state.draft.body;el('draft-status').textContent='Draft ready for review.'}else el('draft-status').textContent=state.errors.draft||'Drafting the pull request…';
el('publish').disabled=!state.draft||!!state.result||state.publishing;
if(state.result){el('publication').replaceChildren(document.createTextNode('🦄 Codex Pony opened PR #'+state.result.number+' '));const link=document.createElement('a');link.href=state.result.url;link.textContent='Open pull request';el('publication').append(link)}
el('pony-section').hidden=!state.pony;
if(state.pony)el('pony-title').textContent=(state.pony.name||state.pony.slug)+' — Pony profile';
el('pony-status').textContent=state.profile?'Local only — separate from the pull request.':state.errors.pony||'Researching the pony independently…';
if(state.profile&&state.profile!==lastProfile){lastProfile=state.profile;el('profile').textContent=state.profile;imageIndex(state.profile)}
}catch(error){el('draft-status').textContent=error.message}}
el('publish').onclick=async()=>{el('publish').disabled=true;el('publication').textContent='Publishing with codex-pony…';try{const response=await fetch(root,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const result=await response.json();if(!response.ok)throw new Error(result.error);await refresh()}catch(error){el('publication').textContent=error.message}};
(async()=>{if(intake){const values=intake[1]==='draft'?{title:fragment.get('title'),body:fragment.get('body')}:{profile:fragment.get('profile')};try{const response=await fetch(location.pathname,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const result=await response.json();if(!response.ok)throw new Error(result.error);location.replace(root)}catch(error){el('draft-status').textContent=error.message}return}await refresh();setInterval(refresh,1500)})();
</script></html>
