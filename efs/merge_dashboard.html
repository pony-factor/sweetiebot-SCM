(() => {

    vscode.setState({ ...vscode.getState(), sidebarRatio, timelineRatio, layoutPreferences });

  function bounds(kind) {
    if (kind === 'sidebar') {

      return { total, min: Math.min(160, total / 2), max: total - Math.min(200, total / 2) };
    }
    const total = sidebar.clientHeight - sidebar.querySelector('.section-heading').offsetHeight - byId('timeline-splitter').offsetHeight;
    return { total, min: Math.min(80, total / 2), max: total - Math.min(100, total / 2) };
  }
  function applySize(kind, requested) {
    const { total, min, max } = bounds(kind);
    if (total <= 0) return;

    }
    if (pr.report?.text) showTextPanel(parent, 'AI explanation · GitHub report', pr.report.text, '', true);
    if (!localInfo && !pr.report?.text && !pr.localReview?.text && !pr.review?.text && !pr.analysis?.length) showTextPanel(parent, 'AI explanation', '',
      'No explanation available yet.', true);
    for (const [heading, actions] of [['Decision needed', pr.blockerOptions], ['Manual actions', pr.manualActions]]) {
      if (!actions?.length) continue;
      const choices = show('section', 'panel', undefined, parent);
      show('h3', '', heading, choices);
      const destination = show('label', 'actions', 'Run with ', choices);
      const engine = show('select', '', undefined, destination);
      engine.setAttribute('aria-label', 'Implementation destination');
      for (const [value, label] of [['web', 'GPT web'], ['codex', 'Codex branch workspace']]) {
        const option = show('option', '', label, engine);
        option.value = value;
      }
      engine.value = actionEngine;
      engine.addEventListener('change', () => { actionEngine = engine.value; });
      for (const option of actions) {
        const row = show('div', 'blocker-choice', undefined, choices);
        const emoji = { '+1': '👍', heart: '❤️', rocket: '🚀' }[option.reaction];
        const button = show('button', 'secondary', (emoji ? emoji + ' ' : '') + option.label, row);
        button.disabled = Boolean(pr.actionPending);
        button.addEventListener('click', () => vscode.postMessage({ type: 'blocker-action', number: pr.number,
          headSha: pr.currentHead, actionId: option.id, optionKey: option.key, engine: option.engine || actionEngine }));
        if (option.description) show('div', 'muted', option.description, row);
        if (option.recommended) show('div', 'muted', 'Recommended · see the report for reasoning and tradeoffs', row);
        else if (option.suggested) show('div', 'muted', 'Suggested in the blocker report', row);
        const instructions = show('details', '', undefined, row);
        show('summary', 'muted', 'View instructions', instructions);
        show('p', '', option.prompt, instructions);
      }
      if (pr.actionPending) show('p', 'muted', 'Opening the requested task…', choices);
    }
    showTextPanel(parent, 'Original PR description', pr.description,
      'No PR description supplied.', true);
    show('h3', '', 'Changed files (' + pr.files.length + (pr.filesTruncated ? '+' : '') + ')', parent);
    if (!pr.files.length) show('p', 'empty', 'No file diff loaded yet.', parent);
    for (const file of pr.files) {
      const wrap = show('details', 'file', undefined, parent);
      const summary = show('summary', '', file.name + ' · ' + file.status, wrap);
      show('span', 'muted', '+' + file.additions + ' / −' + file.deletions, summary);
      if (file.patch) renderMergePatch(show('pre', 'diff-patch', undefined, wrap), file.patch);
      else show('p', 'empty', 'Patch unavailable (binary or GitHub omitted it).', wrap);
    }
    show('p', 'footer', 'Live GitHub status and diffs are authoritative. AI-written explanations are labeled separately; no claim of merge success is based on the chat alone.', parent);
    const tree = show('section', 'pr-commit-tree', undefined, layout);
    renderCommitTree(tree, pr.commits, sha => dispatch('open-commit', pr.number, sha));
    if (pr.commitError) show('p', 'muted', 'Commit history unavailable: ' + pr.commitError, tree);
    outer.scrollTop = scroll;
  }
  function render() {
    const ownerLogo = byId('repository');
    const owner = String(model.repository || '').split('/')[0];
    ownerLogo.hidden = !owner;
    ownerLogo.alt = owner + ' logo';
    ownerLogo.title = model.repository || '';
    const ownerLogoUrl = 'https://github.com/' + encodeURIComponent(owner) + '.png?size=64';
    if (ownerLogo.getAttribute('src') !== ownerLogoUrl) ownerLogo.src = ownerLogoUrl;
    const merged = model.prs.filter(p => p.state === 'merged').length;
    const resolved = model.prs.filter(p => p.conflictCleared).length;
    const problems = model.prs.filter(p => ['conflict','review','blocked'].includes(p.state)).length;
    byId('progress').textContent = merged + '/' + model.prs.length +
      ' merged · ' + resolved + ' conflicts cleared · ' + problems + ' need attention';
    byId('bar-fill').style.width = (model.prs.length ? 100 * merged / model.prs.length : 0) + '%';
    byId('notice').hidden = !model.error;
    byId('notice').textContent = model.rateLimitRetryAt && model.error ? rateLimitMessage(model.rateLimitRetryAt, model.timestampMode) : model.error || '';
    const list = byId('prs');
    const listScroll = list.scrollTop;
    list.replaceChildren();
    // Sort a copy so live presentation never changes the merge selection order.
    const visiblePrs = model.prs.slice().sort((a, b) => pullRequestPriority(a) - pullRequestPriority(b));
    if (selected === null && visiblePrs.length) selected = visiblePrs[0].number;
    for (const pr of visiblePrs) {
      const button = show('button', 'pr', undefined, list);
      button.setAttribute('aria-current', String(pr.number === selected));
      const row = show('div', 'row', undefined, button);
      show('span', 'name', '#' + pr.number + ' ' + pr.title, row);
      show('span', 'flag ' + pr.state, labels[pr.state] || 'Pending', row);
      const branchLine = show('div', 'muted', (pr.headLabel || pr.head) + ' → ' + (pr.baseLabel || pr.base), button);
      branchLine.title = pr.head + ' → ' + pr.base;
      button.addEventListener('click', () => { selected = pr.number; render(); });
    }
    list.scrollTop = listScroll;
    const blockers = model.prs.filter(pr => pr.state !== 'merged' && pr.state !== 'closed' && (pr.localReview || pr.state === 'review' || pr.state === 'conflict' || pr.state === 'blocked'));
    const blockerNotice = byId('blocker-notice'); blockerNotice.replaceChildren(); blockerNotice.hidden = !blockers.length;
    if (blockers.length) {
      show('span', '', 'Needs attention', blockerNotice);
      for (const pr of blockers) {
        const button = show('button', 'secondary', (pr.blockerOptions?.length ? 'Review #' + pr.number + ' options' : 'View #' + pr.number + ' integration'), blockerNotice);
        button.addEventListener('click', () => { selected = pr.number; render(); });
      }
    }
    const events = byId('events');
    const timestampMode = ['hidden', 'relative', 'clock'].includes(model.timestampMode)
      ? model.timestampMode : 'hidden';
    byId('timeline-time-mode').value = timestampMode;
    byId('post-summaries').checked = model.postSummaries === true;
    const eventScroll = events.scrollTop;
    events.replaceChildren();
    for (const event of model.events.slice(-400).reverse()) {
      const node = show('div', 'event ' + event.state, undefined, events);
      const heading = show(event.url ? 'a' : 'strong', event.url ? 'event-link' : '',
        '#' + event.number + ' ' + event.message, node);
      if (event.url) {
        heading.href = event.url;
        heading.addEventListener('click', click => {
          click.preventDefault();
          dispatch('open-link', undefined, event.url);
        });
      }
      if (event.details) {
        const detail = show('details', '', undefined, node);
        show('summary', 'muted', 'Details', detail);
        show('div', 'event-details', event.details, detail);
      }
      const label = formatTimelineTimestamp(event.at, timestampMode);
      if (label) {
        const stamp = show('div', 'event-time', label, node);
        stamp.dataset.eventAt = event.at;
        stamp.title = new Date(event.at).toLocaleString();
      }
    }
    events.scrollTop = eventScroll;
    renderDetail();
  }
  window.addEventListener('message', event => {
    if (event.data?.type !== 'state') return;
    const preferences = event.data.layoutPreferences;
    if (preferences && Number.isInteger(preferences.sidebar) && preferences.sidebar >= 15 && preferences.sidebar <= 75 &&
        Number.isInteger(preferences.timeline) && preferences.timeline >= 15 && preferences.timeline <= 80) {
      if (preferences.sidebar !== layoutPreferences?.sidebar) sidebarRatio = preferences.sidebar / 100;
      if (preferences.timeline !== layoutPreferences?.timeline) timelineRatio = preferences.timeline / 100;
      layoutPreferences = preferences;
      restoreSizes();
      saveLayout();
    }
    model = event.data;
    render();
  });
  function refreshRelativeEventTimes() {
    if (model.timestampMode !== 'relative') return;
    if (model.rateLimitRetryAt && model.error) byId('notice').textContent = rateLimitMessage(model.rateLimitRetryAt, 'relative');
    for (const stamp of byId('events').querySelectorAll('.event-time[data-event-at]')) {
      stamp.textContent = formatTimelineTimestamp(stamp.dataset.eventAt, 'relative');
    }
    const pr = model.prs.find(item => item.number === selected);
    const outcome = byId('details').querySelector('[data-merge-outcome]');
    if (pr?.mergedAt && outcome) {
      outcome.textContent = formatMergeOutcome(pr.mergedAt, pr.mergeCommit, 'relative');
    }
  }
  byId('timeline-time-mode').addEventListener('change', event => {
    const mode = event.target.value;
    if (!['hidden', 'relative', 'clock'].includes(mode)) return;
    model.timestampMode = mode;
    render();
    vscode.postMessage({ type: 'timestamp-mode', mode });
  });
  byId('post-summaries').addEventListener('change', event => vscode.postMessage({ type: 'post-summaries', enabled: event.target.checked }));
  byId('refresh').addEventListener('click', () => dispatch('refresh'));
  setInterval(refreshRelativeEventTimes, 30000);
  dispatch('ready');
})();
</script>
</body>
</html>
