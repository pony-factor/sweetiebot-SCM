<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lindsey · Local merge</title>
<style>:root{color-scheme:light dark}body{max-width:780px;margin:40px auto;padding:0 20px;font:14px/1.6 system-ui}h1{font-size:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Lindsey · Local merge</h1><p id="status" role="status">Receiving the prepared resolution…</p><pre id="results"></pre>
<script>
(async () => {
  const fragment = new URLSearchParams(location.hash.slice(1));
  const raw = fragment.get('result');
  // Remove the patch from browser history before doing any work.
  history.replaceState(null, '', location.pathname);
  try {
    if (!raw) throw Error('No prepared resolution. Return to the merge chat for its Apply with Lindsey link.');
    const input = JSON.parse(raw);
    document.getElementById('status').textContent = 'Applying the prepared handoff through the local Git CLI…';
    const response = await fetch(location.pathname, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input) });
    const result = await response.json();
    if (!response.ok || result.error) throw Error(result.error || 'Local merge failed.');
    document.getElementById('status').textContent = result.results.length
      ? 'Local execution finished. GitHub results:'
      : 'No pull requests were delegated. Review the merge report in Lindsey for any blockers.';
    document.getElementById('results').textContent = result.results.map(pr => '#' + pr.number + ' · ' + pr.status + '\n' + (pr.url || pr.reason || '')).join('\n\n');
    if (result.batch) {
      const summary = '\n\nBatch: ' + result.batch.merged.length + ' merged · ' + result.batch.deferred.length + ' need attention';
      document.getElementById('results').textContent += summary;
    }
    if (result.continueUrl) {
      const next = new URL(result.continueUrl);
      if (next.origin !== 'https://chatgpt.com' || new URLSearchParams(next.hash.slice(1)).get('sweetiebot_merge') !== '1') {
        throw Error('Invalid batch continuation destination.');
      }
      document.getElementById('status').textContent = 'Continuing the batch against the refreshed base…';
      setTimeout(() => location.assign(next.href), 1500);
    } else if (result.continuationError) {
      document.getElementById('status').textContent = 'Local result verified; automatic continuation stopped: ' + result.continuationError;
    }
  } catch (error) { document.getElementById('status').textContent = error.message; }
})();
</script></html>
