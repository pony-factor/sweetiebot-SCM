<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Squash on main without altering the pull-request branch</title>
<desc id="desc">Before, main points to B while the pull-request branch points to D following commits C and D from A. After, main advances from B to one squash commit S while the pull-request branch still points to D.</desc>
<rect width="760" height="420" rx="22" fill="#151c29"/>
<g fill="#e9f0f9" font-family="system-ui,-apple-system,sans-serif" font-weight="600"><text x="34" y="47" font-size="23">Before</text><text x="34" y="239" font-size="23">After</text></g>
<g fill="none" stroke="#aab6ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M90 108 H260"/><path d="M90 108 Q165 168 260 168 H435"/><path d="M90 298 H260 H435"/><path d="M90 298 Q165 358 260 358 H435"/></g>
<g fill="#566880" stroke="#d5e2f2" stroke-width="2"><circle cx="90" cy="108" r="27"/><circle cx="260" cy="108" r="27"/><circle cx="260" cy="168" r="27"/><circle cx="435" cy="168" r="27"/><circle cx="90" cy="298" r="27"/><circle cx="260" cy="298" r="27"/><circle cx="260" cy="358" r="27"/><circle cx="435" cy="358" r="27"/></g>
<circle cx="435" cy="298" r="27" fill="#247c59" stroke="#72dfb1" stroke-width="2"/>
<g fill="#fff" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700"><text x="90" y="115">A</text><text x="260" y="115">B</text><text x="260" y="175">C</text><text x="435" y="175">D</text><text x="90" y="305">A</text><text x="260" y="305">B</text><text x="435" y="305">S</text><text x="260" y="365">C</text><text x="435" y="365">D</text></g>
<g font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="500"><text x="310" y="102" fill="#c1cfdf">main</text><text x="485" y="174" fill="#c1cfdf">PR branch</text><text x="485" y="304" fill="#72dfb1">main · one new commit</text><text x="485" y="364" fill="#c1cfdf">PR branch · unchanged</text></g>
</svg>
