name: One-time filename migration compatibility fixes
on:
  push:
    branches: [flitter-kebab-filenames-1104]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair renamed Python modules and test references
        run: python scripts/repair-kebab-migration.py
      - name: Validate repaired syntax and test inventory
        run: |
          python scripts/ci/ci-test-runner.py verify
          python -m compileall -q scripts tests
      - name: Commit non-workflow repairs
        run: |
          git restore --worktree -- .github/workflows
          git rm -f scripts/repair-kebab-migration.py
          git add -A
          if git diff --cached --quiet; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🐛 Repair imports and test paths after filename migration" -m "Resolve hyphenated source paths in runtime dependency packaging and standalone tools, and update remaining test references." -m "Co-authored-by: ChatGPT 6 <noreply@openai.com>"
          git push origin "HEAD:$GITHUB_REF_NAME"
