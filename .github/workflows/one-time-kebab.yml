name: One-time hyphenated filename migration
on:
  push:
    branches: [flitter-kebab-filenames-1104]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rename tracked files and update references
        run: python scripts/rename-to-kebab.py
      - name: Validate renamed test inventory and Python syntax
        run: |
          python scripts/ci/ci-test-runner.py verify
          python -m compileall -q scripts tests
      - name: Create verified migration commit
        run: |
          git restore --worktree -- .github/workflows
          git rm -f scripts/rename-to-kebab.py
          git add -A
          if git diff --cached --quiet; then
            echo "No actual filename or reference changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🗂️ Rename lowercase filenames to kebab case" -m "Rename lowercase tracked filenames, update source and test references, and preserve Python imports with a compatibility resolver." -m "Co-authored-by: ChatGPT 6 <noreply@openai.com>"
          git push origin "HEAD:$GITHUB_REF_NAME"
