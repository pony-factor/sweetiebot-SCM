name: Checks

on:
  # Run once for each push, not again when the same commit is in a pull request.
  # PRs opened from this repository use the checks on their head commit.
  push:

permissions:
  contents: read

jobs:
  inventory:
    name: Test inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify exhaustive, exclusive test assignments
        run: python3 scripts/ci/ci_test_runner.py verify

  suites:
    name: ${{ matrix.label }}
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: commit
            label: Commit system
          - group: branches
            label: Git branches
          - group: branch-names
            label: Branch names and pony packs
          - group: github-pr
            label: GitHub pull requests
          - group: codex
            label: Codex
          - group: kefania
            label: Kefania
          - group: lindsey
            label: Lindsey bulk merge
          - group: browser-ui
            label: Browser and UI
          - group: efs-search
            label: EFS and workspace search
          - group: installation
            label: Installation and configuration
          - group: security
            label: Security and workspace trust
    env:
      PYTHONPATH: scripts:tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect browser-test dependencies
        id: browser
        run: python3 scripts/ci/ci_test_runner.py browser-needed "${{ matrix.group }}" >> "$GITHUB_OUTPUT"
      - name: Install browser-test dependencies
        if: steps.browser.outputs.required == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Run ${{ matrix.label }} checks
        run: python3 scripts/ci/ci_test_runner.py run "${{ matrix.group }}"

  codex-webview-browser:
    name: Chromium CSS and DOM regression
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser-backed Codex webview simulation
        run: |
          python tests/test_codex_queued_edit_browser.py
          python tests/test_codex_webview_browser.py
          python tests/test_codex_webview_iframe.py
      - name: Node.js timestamp and heading tests
        run: |
          node tests/test_codex_hide_chat_timestamps.js
          node tests/test_codex_window_label.js
          node tests/test_codex_usage.js
      - name: Codex manifest label tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -p test_codex_label.py -v

  bot-app-identities:
    name: Separate GitHub App identity regressions
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check separate App auth wiring and regressions
        run: |
          node --check extension/github/app_identity.js
          node --check extension/codex/kefania_runner.js
          node --check extension/github/local_pull_request.js
          node --check extension/merge/lindsey_bulk_merge.js
          node --check extension/github/pull_request.js
          node tests/test_github_app_identity.js
          node tests/test_github_app_settings.js
          node tests/test_kefania_app_environment.js
          node tests/test_lindsey_bulk_merge.js
