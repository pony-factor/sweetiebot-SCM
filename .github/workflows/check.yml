name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile Python
        run: python3 -m py_compile scripts/install.py scripts/configurator.py scripts/commit_diagnostics_dashboard.py scripts/message_bar.py scripts/message_bar_configurator.py scripts/branch_names.py scripts/ai_commit.py scripts/sweetiebot_async_commit.py scripts/model_picker.py scripts/workspace_search.py tests/test_install.py tests/test_configurator.py tests/test_commit_diagnostics_dashboard.py tests/test_message_bar.py tests/test_branch_names.py tests/test_ai_commit.py tests/test_async_commit.py tests/test_model_picker.py tests/test_workspace_search.py

      - name: Run installer tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium

      - name: Check injected JavaScript syntax
        run: |
          node --check assets/workbench/picker.js
          node --check assets/workbench/message_bar.js
          node --check efs/core.js
          node --check efs/ollama.js
          node --check efs/extract.js
          node --check efs/search_index.js
          node --check efs/view.js
          node --check efs/extension.js
          failures=0
          for test_file in tests/test_*.js; do
            if ! node "$test_file"; then
              echo "::error file=$test_file::JavaScript regression test failed"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures JavaScript test file(s) failed."
            exit 1
          fi

  human-squash:
    name: Human-authored PR merge regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run merge author and attribution tests
        run: |
          node --check efs/human_squash_merge.js
          node --check efs/github_pr_actions.js
          node --check efs/merge_pull_request.js
          node tests/test_human_squash_merge.js
          node tests/test_squash_attribution.js
          node tests/test_merge_pull_request.js
          node tests/test_github_pr_actions.js
          node tests/test_pull_request_batch.js

  codex-video-drop:
    name: Codex video-drop regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check screenshot decoder and drop integration
        run: |
          node --check assets/codex/video-frames.js
          node --check assets/codex/image-drop.js
          node tests/test_codex_image_drop.js
          node tests/test_codex_video_drop.js
          node tests/test_codex_adaptive_video.js

  bot-app-identities:
    name: Separate GitHub App identity regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check separate App auth wiring and regressions
        run: |
          node --check efs/github_app_identity.js
          node --check efs/kefania_runner.js
          node --check efs/local_pull_request.js
          node --check efs/lindsey_bulk_merge.js
          node --check efs/pull_request.js
          node tests/test_github_app_identity.js
          node tests/test_kefania_app_environment.js
          node tests/test_lindsey_bulk_merge.js
