name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    name: Test inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify exhaustive, exclusive test assignments
        run: python3 scripts/ci_test_runner.py verify

  suites:
    name: ${{ matrix.label }}
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: commit
            label: Commit system
          - group: branches
            label: Git branches
          - group: branch-names
            label: Branch names and pony packs
          - group: github-pr
            label: GitHub pull requests
          - group: codex
            label: Codex
          - group: kefania
            label: Kefania
          - group: lindsey
            label: Lindsey bulk merge
          - group: browser-ui
            label: Browser and UI
          - group: efs-search
            label: EFS and workspace search
          - group: installation
            label: Installation and configuration
          - group: security
            label: Security and workspace trust
    env:
      PYTHONPATH: scripts:tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect browser-test dependencies
        id: browser
        run: python3 scripts/ci_test_runner.py browser-needed "${{ matrix.group }}" >> "$GITHUB_OUTPUT"
      - name: Install browser-test dependencies
        if: steps.browser.outputs.required == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Run ${{ matrix.label }} checks
        run: python3 scripts/ci_test_runner.py run "${{ matrix.group }}"
