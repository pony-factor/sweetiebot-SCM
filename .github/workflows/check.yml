name: Checks

on:
  # Run once for each push, not again when the same commit is in a pull request.
  # PRs opened from this repository use the checks on their head commit.
  push:

permissions:
  contents: read

jobs:
  workbench-repair:
    name: SCM and browser repair isolation (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify independent repairs with incompatible optional extensions
        run: python -m unittest tests.install.WorkbenchRepairTests tests.install.IndependentRepairTests -v

  published-web-commit-titles:
    name: Published web-commit title safety (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check published follow-ups and safe local replay
        run: |
          python -m unittest -v \
            tests.background_commit.BackgroundCommitTests.test_published_external_commit_blocks_placeholder_replacement \
            tests.background_commit.BackgroundCommitTests.test_web_commit_published_during_generation_cannot_replace_history \
            tests.background_commit.BackgroundCommitTests.test_published_followup_after_title_is_ready_blocks_replacement \
            tests.background_commit.BackgroundCommitTests.test_published_web_followup_blocks_multiple_pending_local_titles \
            tests.background_commit.BackgroundCommitTests.test_published_provisional_without_followup_keeps_existing_sha \
            tests.background_commit.BackgroundCommitTests.test_published_ancestor_allows_unpublished_local_title_finalization \
            tests.background_commit.BackgroundCommitTests.test_previously_blocked_published_job_can_resume_without_rewrite \
            tests.background_commit.BackgroundCommitTests.test_published_title_fast_forwards_clean_branch_to_web_commits \
            tests.background_commit.BackgroundCommitTests.test_published_title_does_not_fast_forward_dirty_checkout \
            tests.background_commit.BackgroundCommitTests.test_linear_external_commit_survives_pending_title_and_push

  inventory:
    name: Test inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify exhaustive, exclusive test assignments
        run: python3 scripts/ci/ci_test_runner.py verify

  coreml-bridge:
    name: Compile optional Neural Engine bridge
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build optional Swift bridge (no model download)
        run: swift build --package-path native/coreml-llm-bridge -c release --product sweetiebot-ane

  suites:
    name: ${{ matrix.label }}
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: commit
            label: Commit system
          - group: branches
            label: Git branches
          - group: branch-names
            label: Branch names and pony packs
          - group: github-pr
            label: GitHub pull requests
          - group: codex
            label: Codex
          - group: kefania
            label: Kefania
          - group: lindsey
            label: Lindsey bulk merge
          - group: browser-ui
            label: Browser and UI
          - group: efs-search
            label: EFS and workspace search
          - group: installation
            label: Installation and configuration
          - group: security
            label: Security and workspace trust
    env:
      PYTHONPATH: scripts:tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect browser-test dependencies
        id: browser
        run: python3 scripts/ci/ci_test_runner.py browser-needed "${{ matrix.group }}" >> "$GITHUB_OUTPUT"
      - name: Install browser-test dependencies
        if: steps.browser.outputs.required == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Run ${{ matrix.label }} checks
        run: python3 scripts/ci/ci_test_runner.py run "${{ matrix.group }}"

  worktree-window-handoff:
    name: Worktree window handoff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check worktree handoff source and test syntax
        run: |
          node --check extension/branches/window.js
          node --check extension/branches/shared_main.js
          node --check extension/branches/strip.js
          node --check extension/branches/actions.js
          node --check tests/branch_window.js
          node --check tests/branch_strip.js
          node --check tests/shared_main.js
      - name: Test live-window focus, refusal, and stale session handling
        run: node tests/branch_window.js
      - name: Test Git's occupied-branch checkout guard
        run: node tests/branch_strip.js
      - name: Test real Git worktrees, session publication, and branch handoff
        run: node tests/shared_main.js

  worktree-shutdown-safety:
    name: Closed worktree safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shutdown and pruning source and test syntax
        run: |
          node --check extension/branches/workspace_activity.js
          node --check extension/branches/workspace_prune.js
          node --check extension/branches/closed_worktree.js
          node --check tests/workspace_activity.js
          node --check tests/workspace_prune.js
      - name: Test window shutdown scheduling and heartbeat cleanup
        run: node tests/workspace_activity.js
      - name: Test real Git worktree detachment and data-preservation gates
        run: node tests/workspace_prune.js

  codex-webview-browser:
    name: Chromium CSS and DOM regression
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser-backed Codex webview simulation
        run: |
          python tests/codex_queued_edit_browser.py
          python tests/codex_webview_browser.py
          python tests/codex_webview_iframe.py
      - name: Commit wand placement, shared outline and workflow recovery
        run: python tests/workflow_recovery_browser.py
      - name: Node.js timestamp, heading and countdown tests
        run: |
          node tests/codex_hide_chat_timestamps.js
          node tests/codex_window_label.js
          node tests/codex_usage.js
          node tests/codex_countdown.js
      - name: Current Codex usage-banner compatibility
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.install.ResolvedCountdownTests -v
      - name: Codex manifest label tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.codex_label -v

  bot-app-identities:
    name: Separate GitHub App identity regressions
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check separate App auth wiring and regressions
        run: |
          node --check extension/github/app_identity.js
          node --check extension/codex/kefania_runner.js
          node --check extension/github/local_pull_request.js
          node --check extension/merge/lindsey_bulk_merge.js
          node --check extension/github/pull_request.js
          node tests/github_app_identity.js
          node tests/github_app_settings.js
          node tests/kefania_app_environment.js
          node tests/lindsey_bulk_merge.js

  packaged-runtime:
    name: Installed extension imports (${{ matrix.os }})
    needs: inventory
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve every installed relative JavaScript dependency
        run: python -m unittest tests.packaged_runtime -v

  native-prompt-transport:
    name: Sandboxed browser prompt transport (${{ matrix.os }}, Electron ${{ matrix.electron }})
    needs: inventory
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        electron: ['43.7.7', '45.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the native test runtime
        run: npm install --prefix "$RUNNER_TEMP/sweetiebot-native-ci" --no-save electron@${{ matrix.electron }}
      - name: Exercise sandbox, strict CSP, prompt delivery and JSON handoff
        shell: bash
        run: |
          unset ELECTRON_RUN_AS_NODE
          runner="$RUNNER_TEMP/sweetiebot-native-ci/node_modules/.bin/electron"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Electron's Chromium sandbox requires a root-owned, setuid helper.
            # Do not disable sandboxing or pass --no-sandbox in this security test.
            # Some runners defer the Electron binary download until first use.
            node "$RUNNER_TEMP/sweetiebot-native-ci/node_modules/electron/install.js"
            sandbox="$RUNNER_TEMP/sweetiebot-native-ci/node_modules/electron/dist/chrome-sandbox"
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
            test -u "$sandbox"
            test "$(stat -c %u "$sandbox")" = 0
            xvfb-run -a "$runner" tests/fixtures/prompt-transport.cjs
          else
            "$runner" tests/fixtures/prompt-transport.cjs
          fi
