name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile Python
        run: python3 -m py_compile scripts/install.py scripts/configurator.py scripts/commit_diagnostics_dashboard.py scripts/message_bar.py scripts/message_bar_configurator.py scripts/ai_commit.py scripts/sweetiebot_async_commit.py scripts/model_picker.py scripts/workspace_search.py tests/test_install.py tests/test_configurator.py tests/test_commit_diagnostics_dashboard.py tests/test_message_bar.py tests/test_ai_commit.py tests/test_async_commit.py tests/test_model_picker.py tests/test_workspace_search.py

      - name: Run Python tests (excluding branch-name catalog checks)
        run: |
          mapfile -t test_modules < <(find tests -maxdepth 1 -type f -name 'test_*.py' ! -name 'test_branch_names.py' -printf '%f\n' | sort | sed 's/\.py$//')
          PYTHONPATH="scripts:tests" python3 -m unittest -v "${test_modules[@]}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps chromium

      - name: Check injected JavaScript syntax
        run: |
          node --check assets/workbench/picker.js
          node --check assets/workbench/message_bar.js
          node --check efs/core.js
          node --check efs/ollama.js
          node --check efs/extract.js
          node --check efs/search_index.js
          node --check efs/view.js
          node --check efs/extension.js
          failures=0
          for test_file in tests/test_*.js; do
            if [ "$test_file" = tests/test_branch_name_selection.js ]; then
              continue
            fi
            if ! node "$test_file"; then
              echo "::error file=$test_file::JavaScript regression test failed"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures JavaScript test file(s) failed."
            exit 1
          fi

  branch-names:
    name: Branch name and pony pack checks
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check branch-name module syntax
        run: |
          python3 -m py_compile scripts/branch_names.py tests/test_branch_names.py
          node --check efs/branch_name_selection.js
          node --check tests/test_branch_name_selection.js
      - name: Test pony name catalog and packs
        run: python3 -m unittest discover -s tests -p 'test_branch_names.py' -v
      - name: Test secure name selection and shared history
        run: node tests/test_branch_name_selection.js

  human-squash:
    name: Human-authored PR merge regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run merge author and attribution tests
        run: |
          node --check efs/human_squash_merge.js
          node --check efs/github_pr_actions.js
          node --check efs/merge_pull_request.js
          node tests/test_human_squash_merge.js
          node tests/test_squash_attribution.js
          node tests/test_merge_pull_request.js
          node tests/test_github_pr_actions.js
          node tests/test_pull_request_batch.js

  codex-video-drop:
    name: Codex video-drop regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check screenshot decoder and drop integration
        run: |
          node --check assets/codex/video-frames.js
          node --check assets/codex/image-drop.js
          node tests/test_codex_image_drop.js
          node tests/test_codex_video_drop.js
          node tests/test_codex_adaptive_video.js
