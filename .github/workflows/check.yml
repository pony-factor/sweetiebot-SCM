name: Checks

on:
  # Every push to main runs the full check suite independently.
  push:
    branches: [main]
  # PR updates run the same suite but can supersede older checks for that PR.
  pull_request:

# Only PR runs can cancel one another. Use unique groups for main pushes
# and rerun attempts to avoid replacing even queued main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workbench-repair:
    name: SCM and browser repair isolation (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify independent repairs with incompatible optional extensions
        run: python -m unittest tests.installation.install.WorkbenchRepairTests tests.installation.install.IndependentRepairTests -v

  published-web-commit-titles:
    name: Published web-commit title safety (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check published follow-ups and safe local replay
        run: |
          python -m unittest -v \
            tests.commits.background_commit.BackgroundCommitTests.test_published_external_commit_blocks_placeholder_replacement \
            tests.commits.background_commit.BackgroundCommitTests.test_web_commit_published_during_generation_cannot_replace_history \
            tests.commits.background_commit.BackgroundCommitTests.test_published_followup_after_title_is_ready_blocks_replacement \
            tests.commits.background_commit.BackgroundCommitTests.test_published_web_followup_blocks_multiple_pending_local_titles \
            tests.commits.background_commit.BackgroundCommitTests.test_published_provisional_without_followup_keeps_existing_sha \
            tests.commits.background_commit.BackgroundCommitTests.test_published_ancestor_allows_unpublished_local_title_finalization \
            tests.commits.background_commit.BackgroundCommitTests.test_previously_blocked_published_job_can_resume_without_rewrite \
            tests.commits.background_commit.BackgroundCommitTests.test_published_title_fast_forwards_clean_branch_to_web_commits \
            tests.commits.background_commit.BackgroundCommitTests.test_published_title_does_not_fast_forward_dirty_checkout \
            tests.commits.background_commit.BackgroundCommitTests.test_linear_external_commit_survives_pending_title_and_push

  inventory:
    name: Test inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify exhaustive, exclusive test assignments
        run: python3 scripts/ci/ci-test-runner.py verify

  coreml-bridge:
    name: Compile optional Neural Engine bridge
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build optional Swift bridge (no model download)
        run: swift build --package-path native/coreml-llm-bridge -c release --product sweetiebot-ane

  suites:
    name: ${{ matrix.label }}
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: commit
            label: Commit system
          - group: branches
            label: Git branches
          - group: branch-names
            label: Branch names and pony packs
          - group: github-pr
            label: GitHub pull requests
          - group: codex
            label: Codex
          - group: kefania
            label: Kefania
          - group: lindsey
            label: Lindsey bulk merge
          - group: browser-ui
            label: Browser and UI
          - group: efs-search
            label: EFS and workspace search
          - group: installation
            label: Installation and configuration
          - group: security
            label: Security and workspace trust
    env:
      PYTHONPATH: scripts:tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect browser-test dependencies
        id: browser
        run: python3 scripts/ci/ci-test-runner.py browser-needed "${{ matrix.group }}" >> "$GITHUB_OUTPUT"
      - name: Ignore unavailable optional Microsoft feed during Chromium setup
        if: steps.browser.outputs.required == 'true'
        run: |
          # Ubuntu 26.04 hosted runners may have a failing Microsoft apt source.
          # Chromium dependencies use Ubuntu packages, not this optional feed.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]] && grep -Fq 'packages.microsoft.com/ubuntu/26.04/prod' "$source"; then
              sudo mv -- "$source" "$source.disabled"
            fi
          done
      - name: Install browser-test dependencies
        if: steps.browser.outputs.required == 'true'
        run: |
          npm install --ignore-scripts --no-save --no-package-lock playwright@1.64.1
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run ${{ matrix.label }} checks
        run: python3 scripts/ci/ci-test-runner.py run "${{ matrix.group }}"

  worktree-window-handoff:
    name: Worktree window handoff (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check worktree handoff source and test syntax
        run: |
          node --check extension/branches/window.js
          node --check extension/branches/shared-main.js
          node --check extension/branches/strip.js
          node --check extension/branches/actions.js
          node --check tests/branches/window.js
          node --check tests/branches/strip.js
          node --check tests/branches/shared-main.js
      - name: Test live-window focus, refusal, and stale session handling
        run: node tests/branches/window.js
      - name: Test Git's occupied-branch checkout guard
        run: node tests/branches/strip.js
      - name: Test real Git worktrees, session publication, and branch handoff
        run: node tests/branches/shared-main.js

  worktree-shutdown-safety:
    name: Closed worktree safety (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shutdown and pruning source and test syntax
        run: |
          node --check extension/branches/workspace-activity.js
          node --check extension/branches/workspace-prune.js
          node --check extension/branches/closed-worktree.js
          node --check tests/search/workspace-activity.js
          node --check tests/search/workspace-prune.js
      - name: Test window shutdown scheduling and heartbeat cleanup
        run: node tests/search/workspace-activity.js
      - name: Test real Git worktree detachment and data-preservation gates
        run: node tests/search/workspace-prune.js

  codex-webview-browser:
    name: Chromium CSS and DOM regression
    needs: inventory
    # Playwright 1.64.1 supports Chromium on the current ubuntu-latest image.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ignore unavailable optional Microsoft feed during Chromium setup
        run: |
          # Ubuntu 26.04 hosted runners may have a failing Microsoft apt source.
          # Chromium dependencies use Ubuntu packages, not this optional feed.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]] && grep -Fq 'packages.microsoft.com/ubuntu/26.04/prod' "$source"; then
              sudo mv -- "$source" "$source.disabled"
            fi
          done
      - name: Install Chromium automation
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright --version
          python -m playwright install --with-deps chromium
      - name: Browser-backed Codex webview simulation
        run: |
          python tests/browser/codex-queued-edit-browser.py
          python tests/browser/codex-webview-browser.py
          python tests/browser/codex-webview-iframe.py
      - name: Commit wand placement, shared outline and workflow recovery
        run: python tests/browser/workflow-recovery-browser.py
      - name: Node.js timestamp, heading and countdown tests
        run: |
          node tests/codex/hide-chat-timestamps.js
          node tests/codex/window-label.js
          node tests/codex/usage.js
          node tests/codex/countdown.js
      - name: Current Codex usage-banner compatibility
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.installation.install.ResolvedCountdownTests -v
      - name: Codex manifest label tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.codex.label -v

  bot-app-identities:
    name: Separate GitHub App identity regressions
    needs: inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check separate App auth wiring and regressions
        run: |
          node --check extension/github/app-identity.js
          node --check extension/codex/kefania-runner.js
          node --check extension/github/local-pull-request.js
          node --check extension/merge/lindsey-bulk-merge.js
          node --check extension/github/pull-request.js
          node tests/kefania/github-app-identity.js
          node tests/kefania/github-app-settings.js
          node tests/kefania/app-environment.js
          node tests/lindsey/bulk-merge.js

  packaged-runtime:
    name: Installed extension imports (ubuntu-latest)
    needs: inventory
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve every installed relative JavaScript dependency
        run: python -m unittest tests.installation.packaged_runtime -v


  macos-functionality:
    name: macOS functionality, worktrees, packaging, and filenames
    needs: inventory
    runs-on: macos-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check worktree handoff source and test syntax
        if: ${{ !cancelled() }}
        run: |
          node --check extension/branches/window.js
          node --check extension/branches/shared-main.js
          node --check extension/branches/strip.js
          node --check extension/branches/actions.js
          node --check tests/branches/window.js
          node --check tests/branches/strip.js
          node --check tests/branches/shared-main.js
      - name: Test live-window focus, refusal, and stale session handling
        if: ${{ !cancelled() }}
        run: node tests/branches/window.js
      - name: Test Git's occupied-branch checkout guard
        if: ${{ !cancelled() }}
        run: node tests/branches/strip.js
      - name: Test real Git worktrees, session publication, and branch handoff
        if: ${{ !cancelled() }}
        run: node tests/branches/shared-main.js
      - name: Check shutdown and pruning source and test syntax
        if: ${{ !cancelled() }}
        run: |
          node --check extension/branches/workspace-activity.js
          node --check extension/branches/workspace-prune.js
          node --check extension/branches/closed-worktree.js
          node --check tests/search/workspace-activity.js
          node --check tests/search/workspace-prune.js
      - name: Test window shutdown scheduling and heartbeat cleanup
        if: ${{ !cancelled() }}
        run: node tests/search/workspace-activity.js
      - name: Test real Git worktree detachment and data-preservation gates
        if: ${{ !cancelled() }}
        run: node tests/search/workspace-prune.js
      - name: Resolve every installed relative JavaScript dependency
        if: ${{ !cancelled() }}
        run: python -m unittest tests.installation.packaged_runtime -v
      - name: Detect and stage filename capitalization renames on macOS
        if: ${{ !cancelled() }}
        run: node --test tests/search/case-only-renames.js


  macos-native-prompt-transport:
    name: macOS native browser transport (Electron 43 and 45)
    needs: inventory
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Separate installs prevent one Electron version from replacing the other.
      # Keep each test as a separate step, even when an earlier test fails.
      - name: Install Electron 43.7.7
        id: electron43
        run: npm install --prefix "$RUNNER_TEMP/sweetiebot-native-ci-43" --no-save electron@43.7.7
      - name: Electron 43.7.7 sandbox, CSP, prompt and JSON handoff
        if: ${{ !cancelled() && steps.electron43.outcome == 'success' }}
        shell: bash
        run: |
          unset ELECTRON_RUN_AS_NODE
          "$RUNNER_TEMP/sweetiebot-native-ci-43/node_modules/.bin/electron" tests/fixtures/prompt-transport.cjs
      - name: Electron 43.7.7 cookie and session persistence
        if: ${{ !cancelled() && steps.electron43.outcome == 'success' }}
        shell: bash
        run: python tests/fixtures/browser-cookie-sessions.py "$RUNNER_TEMP/sweetiebot-native-ci-43/node_modules/.bin/electron"
      - name: Install Electron 45.1.0
        id: electron45
        if: ${{ !cancelled() }}
        run: npm install --prefix "$RUNNER_TEMP/sweetiebot-native-ci-45" --no-save electron@45.1.0
      - name: Electron 45.1.0 sandbox, CSP, prompt and JSON handoff
        if: ${{ !cancelled() && steps.electron45.outcome == 'success' }}
        shell: bash
        run: |
          unset ELECTRON_RUN_AS_NODE
          "$RUNNER_TEMP/sweetiebot-native-ci-45/node_modules/.bin/electron" tests/fixtures/prompt-transport.cjs
      - name: Electron 45.1.0 cookie and session persistence
        if: ${{ !cancelled() && steps.electron45.outcome == 'success' }}
        shell: bash
        run: python tests/fixtures/browser-cookie-sessions.py "$RUNNER_TEMP/sweetiebot-native-ci-45/node_modules/.bin/electron"
  native-prompt-transport:
    name: Native browser cookies and prompt transport (ubuntu-latest, Electron ${{ matrix.electron }})
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        electron: ['43.7.7', '45.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the native test runtime
        run: npm install --prefix "$RUNNER_TEMP/sweetiebot-native-ci" --no-save electron@${{ matrix.electron }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise sandbox, strict CSP, prompt delivery and JSON handoff
        shell: bash
        run: |
          unset ELECTRON_RUN_AS_NODE
          runner="$RUNNER_TEMP/sweetiebot-native-ci/node_modules/.bin/electron"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # Electron's Chromium sandbox requires a root-owned, setuid helper.
            # Do not disable sandboxing or pass --no-sandbox in this security test.
            # Some runners defer the Electron binary download until first use.
            node "$RUNNER_TEMP/sweetiebot-native-ci/node_modules/electron/install.js"
            sandbox="$RUNNER_TEMP/sweetiebot-native-ci/node_modules/electron/dist/chrome-sandbox"
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
            test -u "$sandbox"
            test "$(stat -c %u "$sandbox")" = 0
            xvfb-run -a "$runner" tests/fixtures/prompt-transport.cjs
          else
            "$runner" tests/fixtures/prompt-transport.cjs
          fi
      - name: Verify shared cookies, session isolation and persistence after restart
        shell: bash
        run: |
          runner="$RUNNER_TEMP/sweetiebot-native-ci/node_modules/.bin/electron"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python tests/fixtures/browser-cookie-sessions.py "$runner"
          else
            python tests/fixtures/browser-cookie-sessions.py "$runner"
          fi
