name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile Python
        run: python3 -m py_compile scripts/install.py scripts/configurator.py scripts/branch_names.py scripts/ai_commit.py scripts/model_picker.py scripts/workspace_search.py tests/test_install.py tests/test_configurator.py tests/test_branch_names.py tests/test_ai_commit.py tests/test_model_picker.py tests/test_workspace_search.py

      - name: Run installer tests
        run: python3 -m unittest discover -s tests -v

      - name: Check injected JavaScript syntax
        run: |
          node --check assets/workbench/picker.js
          node --check efs/core.js
          node --check efs/ollama.js
          node --check efs/extract.js
          node --check efs/search_index.js
          node --check efs/view.js
          node --check efs/extension.js
          node tests/test_workspace_search_core.js
          node tests/test_workspace_search_index.js
          node tests/test_settings_browser.js
          node tests/test_branch_actions.js
          node tests/test_pull_request.js
