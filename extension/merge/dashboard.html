      handle.classList.add('dragging');
      document.body.classList.add('resizing');
      document.body.style.setProperty('--resize-cursor', kind === 'sidebar' ? 'col-resize' : 'row-resize');
    });

      if (!drag || event.pointerId !== drag.id) return;

      const keys = kind === 'sidebar' ? ['ArrowLeft', 'ArrowRight'] : ['ArrowDown', 'ArrowUp'];
      if (![...keys, 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      const { min, max } = bounds(kind);
      const current = kind === 'sidebar' ? sidebar.clientWidth : byId('timeline').offsetHeight;
      rememberSize(kind, event.key === 'Home' ? min : event.key === 'End' ? max : current + (event.key === keys[0] ? -1 : 1) * (event.shiftKey ? 40 : 10));

  setupSplitter('details-splitter', 'sidebar');
  setupSplitter('timeline-splitter', 'timeline');

  layoutObserver.observe(layout);
  layoutObserver.observe(sidebar);
  restoreSizes();

  let selected = null;
  let disposeCommitTree;
  let actionEngine = 'web';
  const labels = {

    conflict: 'Conflict', review: 'Needs review', blocked: 'Blocked',
    queued: 'Queued', updated: 'Updated', closed: 'Closed'
  };
  function el(tag, className, value) {

    if (value !== undefined) node.textContent = String(value);
    return node;
  }
  function show(tag, cls, text, parent) {
    const node = el(tag, cls, text);
    parent.appendChild(node);
    return node;
  }

    return 1;
  }
  function dispatch(type, number, url) { vscode.postMessage({ type, number, url }); }
  function showTextPanel(parent, heading, content, missing, markdown = false) {
    const panel = el('section', markdown ? 'panel markdown-panel' : 'panel');
    show('h3', '', heading, panel);
    const body = el('div', content ? (markdown ? 'markdown-content' : '') : 'empty');
    if (content && markdown) {
      renderMergeMarkdown(body, content, {
        baseUrl: 'https://github.com/' + model.repository + '/',
        openLink: url => dispatch('open-link', undefined, url)
      });
    } else body.textContent = content || missing;
    panel.appendChild(body);
    parent.appendChild(panel);
    return body;
  }
  function renderDetail() {
    disposeCommitTree?.();
    disposeCommitTree = undefined;
    const outer = byId('details');
    const scroll = outer.scrollTop;
    outer.replaceChildren();
    const layout = show('div', 'pr-detail-layout' + (model.showPrCommits === false ? ' no-commits' : ''), undefined, outer);
    const parent = show('div', '', undefined, layout);
    const pr = model.prs.find(p => p.number === selected);
    if (!pr) return;
    const top = show('div', 'detail-top', undefined, parent);
    show('h2', '', '#' + pr.number + ' ' + pr.title, top);
    show('span', 'flag ' + pr.state, labels[pr.state] || 'Pending', top);
    if (pr.statusMessage) show('div', 'muted', pr.statusMessage, parent);
    const branchLine = show('div', 'muted', (pr.headLabel || pr.head) + ' → ' + (pr.baseLabel || pr.base) +
      (pr.mergeableState ? ' · GitHub: ' + pr.mergeableState : ''), parent);
    branchLine.title = pr.head + ' → ' + (pr.currentBase || pr.base);
    const actions = show('div', 'actions', undefined, parent);
    for (const item of [['open-pr', 'View PR'], ['open-diff', 'GitHub file diff']]) {
      const button = show('button', 'secondary', item[1], actions);
      button.addEventListener('click', () => dispatch(item[0], pr.number));
    }
    if (pr.mergedAt) {
      const outcome = showTextPanel(parent, '✓ Verified outcome',
        formatMergeOutcome(pr.mergedAt, pr.mergeCommit, model.timestampMode), '');
      outcome.dataset.mergeOutcome = 'true';
    } else if (pr.state === 'resolved') {
      showTextPanel(parent, '✓ Conflict resolution', 'GitHub now reports a mergeable PR after a head change. This is not a completed merge.', '');
    }
    if (pr.localRecovery?.stage) showTextPanel(parent,
      'Saved local recovery · not GitHub status',
      'Last local operation: ' + pr.localRecovery.stage +
      (pr.localRecovery.lastPushedHead ? '\nLast prepared commit: ' + pr.localRecovery.lastPushedHead.slice(0, 12) : '') +
      '\nMerge eligibility is always rechecked against GitHub.', '');

    if (pr.localReview?.text && pr.state !== 'merged') showTextPanel(parent,
      pr.snapshotChanged ? 'Batch selection changed' : pr.localReview.notes?.length ? 'Integration notes' : 'Why this PR needs attention', pr.localReview.text, '', true);
    if (pr.review && !pr.analysis?.length && pr.state !== 'merged' &&
        !(pr.inlineReviewComments || []).some(comment => String(comment.id) === String(pr.review.id))) showTextPanel(parent,
      'Human review requested · GitHub comment', pr.review.text, '', true);
    const inlineReview = pr.inlineReviewComments || [];
    if (inlineReview.length) {
      const section = show('section', 'panel markdown-panel', undefined, parent);
      show('h3', '', 'Code review comments (' + inlineReview.length + ')', section);
      for (const comment of inlineReview) {
        const key = pr.number + ':' + comment.id;
        const details = show('details', 'review-comment', undefined, section);
        details.open = expandedReviewComments.has(key);
        details.addEventListener('toggle', () => {
          if (details.open) expandedReviewComments.add(key);
          else expandedReviewComments.delete(key);
        });
        const summary = show('summary', '', undefined, details);
        show('span', 'review-comment-title', comment.title, summary);
        show('span', 'review-comment-location',
          comment.path + ' · ' + comment.location + (comment.outdated ? ' · outdated' : ''), summary);
        const body = show('div', 'review-comment-body markdown-content', undefined, details);
        const meta = show('div', 'review-comment-meta', undefined, body);
        if (comment.author) show('span', '', '@' + comment.author, meta);
        if (comment.url.startsWith('https://github.com/')) {
          const link = show('a', '', 'View on GitHub', meta);
          link.href = comment.url;
          link.addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            dispatch('open-link', undefined, comment.url);
          });
        }
        renderMergeMarkdown(body, comment.text || 'No comment text.', {
          baseUrl: 'https://github.com/' + model.repository + '/',
          openLink: url => dispatch('open-link', undefined, url)
        });
      }
    }
    const localInfo = [pr.localExplanation,
      ...Object.values(pr.localDecisions || {}).map(item =>
        [item.title, item.path, item.description].filter(Boolean).join('\n')),
      pr.localResultReason].filter(Boolean).join('\n\n');
    if (localInfo) {
      const concise = String(pr.localExplanation || pr.localResultReason || '').split(/(?<=[.!?])\s+/)
        .filter(sentence => !/^(Verified|Reverified|Current main|Original|The original|Oldest|Use |Require |The local|PR #|Selected|Inspected|Codex |Preserve the exact)/i.test(sentence)).join(' ');
      showTextPanel(parent, 'AI explanation · Local session', (concise || pr.localResultReason || 'Prepared an integration preserving the current base and this PR’s changes.').slice(0, 600), '', true);
      const runner = show('details', '', undefined, parent);
      show('summary', 'muted', 'Runner details', runner);
      show('div', 'local-runner-details', localInfo, runner);
    }
    if (pr.report?.text) showTextPanel(parent, 'AI explanation · GitHub report', pr.report.text, '', true);
    if (!localInfo && !pr.report?.text && !pr.localReview?.text && !pr.review?.text && !pr.analysis?.length) showTextPanel(parent, 'AI explanation', '',

    const plan = pr.actionPlan;
    if (plan?.kind === 'snapshot' && !plan.actions?.length) showTextPanel(parent, plan.title, plan.description, '');
    if (plan?.actions?.length || plan?.workspaceAction) {
      const choices = show('section', 'panel action-panel', undefined, parent);
      const heading = show('div', 'action-heading', undefined, choices);
      show('h3', '', plan.title, heading);
      const destination = show('div', 'runner-control', undefined, heading);
      show('span', 'muted', 'Run with', destination);
      const runner = show('div', 'runner-switch', undefined, destination);
      runner.dataset.engine = actionEngine;
      runner.setAttribute('role', 'group');
      runner.setAttribute('aria-label', 'Run with');

      for (const [value, label] of [['web', 'ChatGPT'], ['codex', 'Codex']]) {
        const button = show('button', 'runner-option', label, runner);
        button.type = 'button';
        button.setAttribute('aria-pressed', String(actionEngine === value));
        runnerButtons.push([value, button]);
        button.addEventListener('click', () => {
          actionEngine = value;
          vscode.postMessage({ type: 'auto-fix-ci-method', method: value });
          runner.dataset.engine = value;
          for (const [engine, control] of runnerButtons) control.setAttribute('aria-pressed', String(engine === value));
          if (workspaceRow) workspaceRow.hidden = value !== 'codex';
        });
      }
      if (plan.description) show('p', 'muted action-intro', plan.description, choices);
      const addAction = (option, extraClass = '') => {
        const row = show('div', 'blocker-choice' + (extraClass ? ' ' + extraClass : ''), undefined, choices);
        const emoji = { '+1': '👍', heart: '❤️', rocket: '🚀' }[option.reaction];
        const style = plan.kind === 'checks' && option.id === 'fix-checks' ? 'action-primary' : 'secondary action-choice';
        const button = show('button', style, (emoji ? emoji + ' ' : '') + option.label, row);
        button.disabled = Boolean(pr.actionPending);
        button.addEventListener('click', () => vscode.postMessage({ type: 'blocker-action', number: pr.number,
          headSha: pr.currentHead, baseRef: pr.currentBase || pr.base, actionId: option.id, optionKey: option.key, engine: option.engine || actionEngine }));
        if (option.description) show('div', 'muted', option.description, row);
        if (option.recommended) show('div', 'action-recommended', 'Recommended · ' + (option.description || 'Based on the current review'), row);

      };
      for (const option of plan.actions || []) addAction(option);
      if (plan.workspaceAction) {
        workspaceRow = addAction(plan.workspaceAction, 'workspace-only');

      'No PR description supplied.', true);
    show('h3', '', 'Changed files (' + pr.files.length + (pr.filesTruncated ? '+' : '') + ')', parent);
    if (!pr.files.length) show('p', 'empty', 'No file diff loaded yet.', parent);
    for (const file of pr.files) {
      const wrap = show('details', 'file', undefined, parent);
      const summary = show('summary', '', file.name + ' · ' + file.status, wrap);
      show('span', 'muted', '+' + file.additions + ' / −' + file.deletions, summary);

      const tree = show('section', 'pr-commit-tree', undefined, layout);
      disposeCommitTree = renderCommitTree(tree, pr.commits, sha => dispatch('open-commit', pr.number, sha));
      if (pr.commitError) show('p', 'muted', 'Commit history unavailable: ' + pr.commitError, tree);
    }
    outer.scrollTop = scroll;
  }
  function render() {
    const ownerLogo = byId('repository');
    const owner = String(model.repository || '').split('/')[0];
    ownerLogo.hidden = !owner;
    ownerLogo.alt = owner + ' logo';
    ownerLogo.title = model.repository || '';
    const ownerLogoUrl = 'https://github.com/' + encodeURIComponent(owner) + '.png?size=64';
    if (ownerLogo.getAttribute('src') !== ownerLogoUrl) ownerLogo.src = ownerLogoUrl;
    const merged = model.prs.filter(p => p.state === 'merged').length;
    const resolved = model.prs.filter(p => p.conflictCleared).length;
    const blockers = model.prs.filter(pr => pr.state !== 'merged' && pr.state !== 'closed' && (pr.localReview || pr.state === 'review' || pr.state === 'conflict' || pr.state === 'blocked'));
    const problems = blockers.length;

    byId('bar-fill').style.width = (model.prs.length ? 100 * merged / model.prs.length : 0) + '%';
    const pending = model.prs.filter(pr => pr.state !== 'merged' && pr.state !== 'closed');

      'integrating', 'applying-resolution', 'rewrite-approved', 'prepared', 'decision-commit', 'sync-prepared',
      'pushed', 'verifying-push', 'waiting-checks', 'checks-passed', 'merging', 'needs_resolution', 'needs_refresh'];
    const active = pending.length > 0 && !model.error && !(model.rateLimitRetryAt > Date.now()) &&
      (model.workers?.length ? model.workers.some(worker => !['Finished', 'Rate limited'].includes(worker.phase))
        : pending.some(pr => pr.activity ? runningPhases.includes(pr.activity.phase) : !blockers.includes(pr)));

      (active ? '; merge queue active' : pending.length ? '; waiting for attention' : '; queue finished'));

    byId('notice').textContent = model.rateLimitRetryAt && model.error ? rateLimitMessage(model.rateLimitRetryAt, model.timestampMode) : model.error || '';
    const workerList = byId('merge-workers');
    workerList.replaceChildren();
    workerList.hidden = !model.workers?.length;

      button.title = 'GPT session ' + worker.id + ' · ' + worker.numbers.map(number => '#' + number).join(', ');

      const branchLine = show('div', 'muted', (pr.headLabel || pr.head) + ' → ' + (pr.baseLabel || pr.base), button);
      branchLine.title = pr.head + ' → ' + (pr.currentBase || pr.base);

    }
    list.scrollTop = listScroll;

    if (blockers.length) {

      for (const pr of blockers) {
        const button = show('button', 'secondary', (pr.blockerOptions?.length ? 'Review #' + pr.number + ' options' : 'View #' + pr.number + ' integration'), blockerNotice);
        button.addEventListener('click', () => { selected = pr.number; dispatch('select-pr', pr.number); render(); });
      }

    const currentActivity = byId('current-activity');
    currentActivity.replaceChildren();
    const operations = model.prs.filter(pr => pr.activity && pr.state !== 'merged' && pr.state !== 'closed');
    currentActivity.hidden = !operations.length;
    if (operations.length) {
      show('strong', '', 'Current activity', currentActivity);

    }

    byId('timeline-time-mode').value = timestampMode;
    byId('post-status-updates').checked = model.postStatusUpdates === true;
    byId('post-summaries').checked = model.postSummaries === true;
    byId('auto-fix-ci').checked = model.autoFixCi === true;
    byId('auto-fix-ci-method').value = model.autoFixCiMethod === 'codex' ? 'codex' : 'web';

      const node = show('div', 'event ' + event.state, undefined, events);

      const key = event.id ?? (event.at + ':' + event.number + ':' + event.message);
      const line = presentation.expandable
        ? show('details', 'event-disclosure', undefined, node) : node;
      if (presentation.expandable) {

        line.addEventListener('toggle', () => {

          if (line.open) openActivities.add(key);
          else openActivities.delete(key);

        'event-summary', undefined, line);

        presentation.summary === 'PR conversation comment posted';

        ? show('a', 'event-link', undefined, summary) : summary;
      const commentLink = renderMergeActivitySummary(content, event.number, presentation, commentOnlyLink);
      if (event.url) {
        const target = commentLink || content;
        target.href = event.url;
        target.addEventListener('click', click => {
          click.preventDefault();
          click.stopPropagation();
          dispatch('open-link', undefined, event.url);
        });
      }
      if (presentation.expandable) {

        if (presentation.status) show('div', 'event-status', presentation.status, body);
        if (presentation.explanation) show('div', 'event-details', presentation.explanation, body);

  });
  function refreshRelativeEventTimes() {
    if (model.timestampMode !== 'relative') return;

    for (const stamp of byId('events').querySelectorAll('.event-time[data-event-at]')) {
      stamp.textContent = formatTimelineTimestamp(stamp.dataset.eventAt, 'relative');
    }
    const pr = model.prs.find(item => item.number === selected);
    const outcome = byId('details').querySelector('[data-merge-outcome]');

      outcome.textContent = formatMergeOutcome(pr.mergedAt, pr.mergeCommit, 'relative');
    }
  }
  byId('timeline-time-mode').addEventListener('change', event => {
    const mode = event.target.value;

  });

  byId('auto-fix-ci').addEventListener('change', event => vscode.postMessage({ type: 'auto-fix-ci', enabled: event.target.checked }));
  byId('auto-fix-ci-method').addEventListener('change', event => vscode.postMessage({ type: 'auto-fix-ci-method', method: event.target.value }));
  byId('post-summaries').addEventListener('change', event => vscode.postMessage({ type: 'post-summaries', enabled: event.target.checked }));
  byId('refresh').addEventListener('click', () => dispatch('refresh'));
  setInterval(refreshRelativeEventTimes, 30000);
  dispatch('ready');
})();
</script>
