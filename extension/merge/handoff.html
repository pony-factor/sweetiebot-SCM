<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lindsey · Local merge</title>
<style>
__MERGE_HEADER_CSS__
:root{
  color-scheme:light dark;--vscode-editor-background:#f7f8fc;--vscode-editor-foreground:#1e2330;
  --vscode-editorWidget-background:#fff;--vscode-panel-border:#dce1eb;
  --vscode-descriptionForeground:#596579;--merge-complete-color:#ac11ff;
  --merge-warning:#ad5a04;--merge-danger:#bd3535;
}
@media(prefers-color-scheme:dark){
  :root{
    --vscode-editor-background:#111318;--vscode-editor-foreground:#eef0f6;
    --vscode-editorWidget-background:#1b1e27;--vscode-panel-border:#343a49;
    --vscode-descriptionForeground:#a8b0c1;--merge-warning:#f2be67;--merge-danger:#f18c89;
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--vscode-editor-background);color:var(--vscode-editor-foreground);font:14px/1.55 system-ui,sans-serif}
.owner-logo.handoff-mark{display:grid;place-items:center;color:var(--merge-complete-color);font-size:19px;font-weight:700}
.header-summary{
  display:flex;align-items:center;gap:9px;max-width:100%;padding:9px 14px;
  border:1px solid var(--merge-border);border-radius:14px;
  background:var(--merge-surface);box-shadow:0 4px 18px rgba(0,0,0,.08);
  font-size:12px;font-weight:650;overflow-wrap:anywhere
}
.header-summary::before{content:"";flex:0 0 5px;height:16px;border-radius:3px;background:var(--merge-complete-color)}
.handoff-content{max-width:900px;margin:32px auto;padding:0 22px 56px}
.status-panel{
  padding:24px;border:1px solid var(--merge-border);border-radius:16px;
  background:var(--merge-surface);box-shadow:0 6px 24px rgba(0,0,0,.06)
}
.eyebrow{color:var(--merge-muted);font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
h2{margin:5px 0 8px;font-size:21px;line-height:1.35;letter-spacing:-.02em}
#status{margin:0 0 20px;color:var(--merge-muted);overflow-wrap:anywhere}
.result-list{display:grid;gap:10px}
.pr-result{border:1px solid var(--merge-border);border-radius:12px;background:var(--vscode-editor-background);padding:14px 16px;min-width:0}
.pr-result-head{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.pr-number{font-size:14px}
.flag{
  display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--merge-border);
  border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;line-height:1.5;
  text-transform:capitalize;white-space:nowrap
}
.flag.merged{color:var(--merge-complete-color);border-color:currentColor;background:color-mix(in srgb,var(--merge-complete-color) 9%,transparent)}
.flag.synced{color:var(--merge-success);border-color:currentColor}
.flag.blocked,.flag.error,.flag.failed{color:var(--merge-danger);border-color:currentColor}
.flag.waiting,.flag.deferred{color:var(--merge-warning);border-color:currentColor}
.pr-detail{margin:8px 0 0;color:var(--merge-muted);white-space:pre-wrap;overflow-wrap:anywhere}
.pr-link{display:inline-block;margin-top:9px;color:var(--vscode-textLink-foreground,#758cf7);font-weight:600;overflow-wrap:anywhere}
.pr-link:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.batch-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--merge-border);margin-top:20px;padding-top:15px;font-size:13px;font-weight:650}
.batch-summary .muted{color:var(--merge-muted)}
@media(max-width:650px){
  .handoff-content{margin:18px auto;padding:0 12px 28px}
  .status-panel{padding:17px;border-radius:12px}
  .header-summary{width:100%}
}
</style>
<header class="merge-header">
  <div class="dashboard-brand"><span class="owner-logo handoff-mark" aria-hidden="true">⇄</span><h1>Lindsey · Local merge</h1></div>
  <div class="header-summary" id="summary" role="status" aria-live="polite">Awaiting handoff</div>
</header>
<main class="handoff-content">
  <section class="status-panel" aria-labelledby="report-title">
    <div class="eyebrow">Lindsey merge workflow</div>
    <h2 id="report-title">Local Git results</h2>
    <p id="status" role="status" aria-live="polite">Receiving the prepared resolution…</p>
    <div id="results" class="result-list" aria-label="Pull request outcomes"></div>
  </section>
</main>
<script>
(async () => {
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');
  const fragment = new URLSearchParams(location.hash.slice(1));
  const raw = fragment.get('result');
  history.replaceState(null, '', location.pathname);
  let finished = false, timer, postPending = false;
  const stop = () => { finished = true; clearInterval(timer); };
  function display(result) {
    if (finished) return;
    if (!Array.isArray(result.results)) throw Error('Invalid local execution response.');
    stop();
    status.textContent = result.results.length ? 'Local execution finished. GitHub results:'
      : 'No pull requests were delegated. Review the merge report in Lindsey for any blockers.';
    const cards = result.results.map(pr => {
      const card = document.createElement('article');
      card.className = 'pr-result';
      const heading = document.createElement('div');
      heading.className = 'pr-result-head';
      const number = document.createElement('strong');
      number.className = 'pr-number';
      number.textContent = '#' + pr.number;
      const flag = document.createElement('span');
      const state = String(pr.status || 'unknown').toLowerCase();
      flag.className = 'flag ' + (/^(merged|synced|blocked|error|failed|waiting|deferred)$/.test(state) ? state : 'other');
      flag.textContent = state;
      heading.append(number, flag);
      card.append(heading);
      if (pr.reason) {
        const reason = document.createElement('p');
        reason.className = 'pr-detail';
        reason.textContent = pr.reason;
        card.append(reason);
      }
      // Runner fields are rendered as text. Only GitHub PR/commit URLs become links.
      if (typeof pr.url === 'string') {
        let safeUrl;
        try {
          const url = new URL(pr.url);
          if (url.protocol === 'https:' && url.hostname === 'github.com' && !url.username &&
              !url.password && !url.port &&
              /^\/[\w.-]+\/[\w.-]+\/(?:pull\/\d+(?:\/.*)?|commit\/[0-9a-f]{40})$/.test(url.pathname)) safeUrl = url.href;
        } catch { /* Ignore unsafe or malformed URLs. */ }
        if (safeUrl) {
          const link = document.createElement('a');
          link.className = 'pr-link';
          link.href = safeUrl;
          link.rel = 'noopener noreferrer';
          link.textContent = 'View on GitHub';
          card.append(link);
        }
      }
      return card;
    });
    if (result.batch) {
      const total = document.createElement('div');
      total.className = 'batch-summary';
      const merged = document.createElement('span');
      merged.textContent = result.batch.merged.length + ' merged';
      const deferred = document.createElement('span');
      deferred.className = 'muted';
      deferred.textContent = '· ' + result.batch.deferred.length + ' need attention';
      total.append(merged, deferred);
      cards.push(total);
      summary.textContent = result.batch.merged.length + ' merged · ' + result.batch.deferred.length + ' need attention';
    } else {
      summary.textContent = result.results.length + ' PR' + (result.results.length === 1 ? '' : 's') + ' processed';
    }
    results.replaceChildren(...cards);
    if (result.continueUrl) {
      const next = new URL(result.continueUrl);
      if (next.origin !== 'https://chatgpt.com' || next.username || next.password ||
          new URLSearchParams(next.hash.slice(1)).get('sweetiebot_merge') !== '1') throw Error('Invalid batch continuation destination.');
      status.textContent = 'Continuing the batch against the refreshed base…';
      const link = document.createElement('a');
      link.textContent = 'Continue in GPT web'; link.href = next.href;
      results.after(link);
      location.assign(next.href);
    } else if (result.continuationError) status.textContent = 'Local result verified; automatic continuation stopped: ' + result.continuationError;
  }
  async function recover() {
    const response = await fetch(location.pathname + '/status');
    if (!response.ok) {
      if (postPending) {
        clearInterval(timer);
        status.textContent = 'Live progress is unavailable from this handoff. Waiting for the original local execution result; no retry was submitted.';
        return 'legacy';
      }
      throw Error('This handoff is unavailable or expired. Return to Lindsey and start a fresh task; no automatic retry was submitted.');
    }
    const state = await response.json();
    if (state.phase === 'finished') display(state.result);
    else if (state.phase === 'failed') { stop(); status.textContent = state.error; }
    else if (state.phase === 'running') status.textContent = 'Local Git execution is still running. Progress is shown in the Lindsey dashboard; reloading this page will not run it twice.';
    else if (state.phase === 'continuing') status.textContent = 'Local execution finished; preparing the next review against the current base…';
    return state.phase;
  }
  const watch = () => {
    timer = setInterval(() => { if (!finished) void recover().catch(error => {
      if (postPending) {
        clearInterval(timer);
        status.textContent = 'Live progress is unavailable. Waiting for the original local execution result; no retry was submitted.';
        return;
      }
      stop(); status.textContent = 'Cannot contact the local handoff: ' + error.message;
    }); }, 2000);
  };
  try {
    if (!raw) {
      const phase = await recover();
      if (phase === 'ready') throw Error('No prepared resolution. Return to the merge chat for its complete Apply with Lindsey link.');
      if (!finished) watch();
      return;
    }
    let input;
    try { input = JSON.parse(raw); }
    catch { throw Error('The prepared result is incomplete or malformed. No Git operation was started. Return to GPT web and use the complete final Apply with Lindsey link.'); }
    status.textContent = 'Applying the prepared handoff through the local Git CLI…';
    summary.textContent = 'Applying locally';
    postPending = true;
    watch();
    const response = await fetch(location.pathname, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input) });
    const result = await response.json();
    postPending = false;
    if (response.status === 409 && /in progress/.test(result.error || '')) { await recover(); return; }
    if (!response.ok || result.error) throw Error(result.error || 'Local merge failed.');
    display(result);
  } catch (error) { stop(); status.textContent = error.message; summary.textContent = 'Needs attention'; }
})();
</script></html>
